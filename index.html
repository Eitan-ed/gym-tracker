// ─── IndexedDB helper (למוזיקה) ────────────────────────────
const IDB = (() => {
    let dbP = null;
    const open = () => {
        if (dbP) return dbP;
        dbP = new Promise((res, rej) => {
            const req = indexedDB.open('gym-tracker-db', 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore('files');
            req.onsuccess = e => res(e.target.result);
            req.onerror   = () => { dbP = null; rej(); };
        });
        return dbP;
    };
    return {
        get: async (key) => {
            try {
                const db = await open();
                return new Promise(res => {
                    const req = db.transaction('files','readonly').objectStore('files').get(key);
                    req.onsuccess = () => res(req.result ?? null);
                    req.onerror   = () => res(null);
                });
            } catch { return null; }
        },
        set: async (key, val) => {
            try {
                const db = await open();
                return new Promise(res => {
                    const tx = db.transaction('files','readwrite');
                    const req = tx.objectStore('files').put(val, key);
                    req.onsuccess = () => res(true);
                    req.onerror   = () => res(false);
                });
            } catch { return false; }
        },
        del: async (key) => {
            try {
                const db = await open();
                return new Promise(res => {
                    const tx = db.transaction('files','readwrite');
                    const req = tx.objectStore('files').delete(key);
                    req.onsuccess = () => res(true);
                    req.onerror   = () => res(false);
                });
            } catch { return false; }
        },
    };
})();

// ─── משקל הסט הבא — המשקל האחרון בפועל (לא השיא ההיסטורי) ───
// doneS1/doneS2: האם כבר בוצע באימון הנוכחי (undefined = לא ידוע, מתייחסים כלא בוצע)
function getNextSetWeight(exId, logs, doneS1=false, doneS2=false) {
    const lastOfSet = (setNum) => logs.filter(l => l.exId===exId && l.setNum===setNum && l.weight>0)
        .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    const last1 = lastOfSet(1), last2 = lastOfSet(2);
    if (!doneS1) return last1?.weight ?? last2?.weight ?? 0;
    if (!doneS2) return last2?.weight ?? last1?.weight ?? 0;
    const latest = [last1,last2].filter(Boolean).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    return latest?.weight ?? 0;
}
function getLastWarmupWeight(exId, logs) {
    const w = logs.filter(l => l.exId===exId && l.setNum===0 && l.weight>0)
        .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    return w?.weight ?? 0;
}
// ─── חזרות הסט הבא / חזרות החימום — אותה לוגיקה כמו המשקל, לצורך הצגה בפופאפ המעבר האוטומטי ───
function getNextSetReps(exId, logs, doneS1=false, doneS2=false) {
    const lastOfSet = (setNum) => logs.filter(l => l.exId===exId && l.setNum===setNum && l.reps>0)
        .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    const last1 = lastOfSet(1), last2 = lastOfSet(2);
    if (!doneS1) return last1?.reps ?? last2?.reps ?? 0;
    if (!doneS2) return last2?.reps ?? last1?.reps ?? 0;
    const latest = [last1,last2].filter(Boolean).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    return latest?.reps ?? 0;
}
function getLastWarmupReps(exId, logs) {
    const w = logs.filter(l => l.exId===exId && l.setNum===0 && l.reps>0)
        .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    return w?.reps ?? 0;
}
// ─── משקל להצגה ליד התמונה — המשקל הגבוה מבין הסטים באימון האחרון,
// ובלבד שבוצעו בו יותר מ-7 חזרות לסט ───────────────────────────
function getLastDisplayWeight(exId, logs) {
    const exLogs = logs.filter(l => l.exId===exId && (l.setNum===1 || l.setNum===2) && l.weight>0)
        .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    if (!exLogs.length) return 0;
    const lastDate = new Date(exLogs[0].timestamp).toDateString();
    const sameSession = exLogs.filter(l => new Date(l.timestamp).toDateString()===lastDate && l.reps>7);
    if (!sameSession.length) return 0;
    return Math.max(...sameSession.map(l=>l.weight));
}

// ─── Roller (Hybrid Picker) ─────────────────────────────────
const DRUM_H    = 48;
const DRUM_VIS  = 7;
const DRUM_HALF = 3;

const Roller = memo(({ value, onChange, min=0, max=250, step=1, drumStep=null, label, isChanged, presets=[], jumpSteps=[], values=null }) => {
    const [open,     setOpen]     = useState(false);
    const [localVal, setLocalVal] = useState(value);

    const listRef    = React.useRef(null);
    const settling   = React.useRef(false);
    const timerRef   = React.useRef(null);
    const fromBtn    = React.useRef(false);

    const effDrumStep = drumStep !== null ? drumStep : step;
    const options = useMemo(() => {
        if (values) return values;
        const o = [];
        for (let v = min; v <= max; v = parseFloat((v + effDrumStep).toFixed(10)))
            o.push(parseFloat(v.toFixed(4)));
        return o;
    }, [min, max, effDrumStep, values]);

    const scrollTo = useCallback((idx, smooth=false) => {
        if (!listRef.current) return;
        listRef.current.scrollTo({ top: idx * DRUM_H, behavior: smooth ? 'smooth' : 'instant' });
    }, []);

    // כשנפתח — אתחל localVal לערך הנוכחי (מעוגל לאפשרות הקרובה אם לא קיים בדיוק)
    useEffect(() => {
        if (!open) return;
        const exact = options.indexOf(value);
        if (exact >= 0) { setLocalVal(value); return; }
        const ni = options.reduce((b, o, i) => Math.abs(o - value) < Math.abs(options[b] - value) ? i : b, 0);
        setLocalVal(options[ni]);
    }, [open]);

    // כשlocalVal משתנה מכפתור — גלול לשם
    useEffect(() => {
        if (!open) return;
        let idx = options.indexOf(localVal);
        if (idx < 0) idx = options.reduce((b,o,i) => Math.abs(o-localVal)<Math.abs(options[b]-localVal)?i:b, 0);
        settling.current = true;
        requestAnimationFrame(() => {
            scrollTo(idx, fromBtn.current);
            fromBtn.current = false;
            setTimeout(() => { settling.current = false; }, 400);
        });
    }, [localVal, open, options, scrollTo]);

    const handleScroll = useCallback(() => {
        if (settling.current) return;
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
            if (!listRef.current) return;
            const idx = Math.round(listRef.current.scrollTop / DRUM_H);
            const c   = Math.min(Math.max(idx, 0), options.length - 1);
            settling.current = true;
            scrollTo(c, true);
            setLocalVal(options[c]);
            setTimeout(() => { settling.current = false; }, 250);
        }, 80);
    }, [options, scrollTo]);

    const adjust = useCallback((delta) => {
        setLocalVal(prev => {
            let idx = options.indexOf(prev);
            if (idx < 0) idx = options.reduce((b,o,i) => Math.abs(o-prev)<Math.abs(options[b]-prev)?i:b, 0);
            const ni = Math.min(Math.max(idx + (values ? delta : Math.round(delta/step)), 0), options.length-1);
            fromBtn.current = true;
            return options[ni];
        });
    }, [options, step, values]);

    const confirm = useCallback(() => { onChange(localVal); setOpen(false); }, [localVal, onChange]);

    return (
        <div className="flex flex-col items-center flex-1">
            <button onClick={() => setOpen(true)}
                className={`w-full h-12 rounded-xl font-black text-[22px] flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-all
                    ${isChanged ? 'bg-blue-50 text-blue-600 ring-2 ring-blue-200' : 'bg-slate-100 text-slate-800'}`}>
                <span>{value}</span>
                <span className="text-[9px] font-black opacity-50 tracking-tighter uppercase">{label}</span>
            </button>
            {open && (
                <div className="fixed inset-0 z-[800] flex items-end" onClick={confirm}>
                    <div className="absolute inset-0 bg-slate-900/50" />
                    <div className="relative w-full bg-white rounded-t-3xl shadow-2xl" onClick={e => e.stopPropagation()}>
                        {/* כותרת */}
                        <div className="flex justify-between items-center px-5 pt-5 pb-2" dir="rtl">
                            <span className="text-base font-black text-slate-700">{label}</span>
                            <button onClick={confirm} className="px-5 py-2 bg-slate-900 text-white rounded-2xl font-black text-sm active:scale-95">אישור</button>
                        </div>
                        {/* מספרים קרובים */}
                        {(() => {
                            const nearby = values ? (()=>{
                                const ci=options.findIndex(v=>Math.abs(v-localVal)<0.01);
                                const si=ci>=0?ci:options.reduce((b,v,i)=>Math.abs(v-localVal)<Math.abs(options[b]-localVal)?i:b,0);
                                return [-3,-2,-1,0,1,2,3].map(d=>options[si+d]).filter(v=>v!=null);
                            })() : [-3,-2,-1,0,1,2,3].map(d => parseFloat((localVal + d*step).toFixed(4))).filter(v => v >= min && v <= max);
                            return (
                                <div className="px-5 pb-2 flex gap-2 overflow-x-auto no-scrollbar justify-center" dir="ltr">
                                    {nearby.map(p => (
                                        <button key={p}
                                            onClick={() => { if (p === localVal) { confirm(); return; } fromBtn.current=true; setLocalVal(p); }}
                                            className={`shrink-0 px-3 py-1.5 rounded-xl text-sm font-black active:scale-95 transition-all
                                                ${p===localVal ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700'}`}>
                                            {p}
                                        </button>
                                    ))}
                                </div>
                            );
                        })()}
                        {/* כפתורי קפיצה */}
                        <div className="px-4 pb-3 flex items-center gap-1.5 justify-center" dir="ltr">
                            {[...jumpSteps].reverse().map(s => (
                                <button key={`-${s}`} onClick={() => adjust(-s)}
                                    className="flex-1 py-5 bg-rose-50 text-rose-600 rounded-xl font-black text-lg active:scale-95 active:bg-rose-100">
                                    -{s}
                                </button>
                            ))}
                            <button onClick={confirm} className="px-3 py-2 bg-slate-900 text-white rounded-xl font-black text-xl min-w-[4.5rem] text-center active:scale-95 active:bg-slate-700">
                                {localVal}
                            </button>
                            {jumpSteps.map(s => (
                                <button key={`+${s}`} onClick={() => adjust(s)}
                                    className="flex-1 py-5 bg-emerald-50 text-emerald-600 rounded-xl font-black text-lg active:scale-95 active:bg-emerald-100">
                                    +{s}
                                </button>
                            ))}
                        </div>
                        {/* גלגלת לכוונון עדין */}
                        <div className="relative mx-6 mb-6" style={{height: DRUM_VIS * DRUM_H + 'px'}}>
                            <div className="absolute inset-x-0 pointer-events-none z-10"
                                style={{top: DRUM_HALF * DRUM_H + 'px', height: DRUM_H + 'px',
                                    background:'rgba(59,130,246,0.07)',
                                    borderTop:'2px solid rgba(59,130,246,0.3)',
                                    borderBottom:'2px solid rgba(59,130,246,0.3)'}} />
                            <div ref={listRef} onScroll={handleScroll}
                                className="h-full overflow-y-scroll no-scrollbar"
                                style={{scrollSnapType:'y mandatory', WebkitOverflowScrolling:'touch'}}>
                                <div style={{height: DRUM_HALF * DRUM_H + 'px'}} />
                                {options.map(o => (
                                    <div key={o} onClick={() => { if (o === localVal) { confirm(); return; } fromBtn.current=true; setLocalVal(o); }}
                                        style={{height: DRUM_H + 'px', scrollSnapAlign:'center'}}
                                        className={`flex items-center justify-center select-none cursor-pointer transition-all
                                            ${o===localVal ? 'font-black text-[22px] text-slate-900' : 'font-medium text-[15px] text-slate-400'}`}>
                                        {o}
                                    </div>
                                ))}
                                <div style={{height: DRUM_HALF * DRUM_H + 'px'}} />
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
});

// ─── PlankTimer ────────────────────────────────────────────
const PLANK_PRESETS = [20,30,45,60,90,120];
function PlankTimer() {
    const [seconds,   setSeconds]   = useState(60);
    const [remaining, setRemaining] = useState(null);
    const [running,   setRunning]   = useState(false);
    const itvRef = React.useRef(null);

    const start = () => { setRemaining(seconds); setRunning(true); };
    const stop  = () => { clearInterval(itvRef.current); setRunning(false); setRemaining(null); };

    useEffect(() => {
        if (!running) return;
        itvRef.current = setInterval(() => {
            setRemaining(r => {
                if (r <= 1) {
                    clearInterval(itvRef.current);
                    setRunning(false);
                    playPhoneRingSound();
                    return 0;
                }
                if (r <= 4) playCountdownBeep();
                return r - 1;
            });
        }, 1000);
        return () => clearInterval(itvRef.current);
    }, [running]);

    const pct = remaining !== null ? (remaining / seconds) * 100 : 100;
    const color = remaining <= 5 ? '#ef4444' : remaining <= 20 ? '#f59e0b' : '#84cc16';

    return (
        <div className="bg-lime-50 rounded-2xl border border-lime-200 p-4 mt-3">
            {remaining === null ? (<>
                <div className="text-[11px] font-black text-lime-600 mb-2">⏱ זמן פלאנק</div>
                <div className="flex gap-1.5 flex-wrap mb-3">
                    {PLANK_PRESETS.map(p => (
                        <button key={p} onClick={()=>setSeconds(p)}
                            className={`px-2.5 py-1 rounded-xl text-[12px] font-black active:scale-95 transition-all
                                ${p===seconds?'bg-lime-500 text-white':'bg-white border border-lime-200 text-lime-700'}`}>
                            {p}″
                        </button>
                    ))}
                </div>
                <div className="flex gap-2 items-center mb-3">
                    <button onClick={()=>setSeconds(s=>Math.max(10,s-5))} className="px-3 py-2 bg-rose-50 text-rose-500 rounded-xl font-black text-sm active:scale-95">-5</button>
                    <div className="flex-1 text-center text-3xl font-black text-slate-800">{seconds}″</div>
                    <button onClick={()=>setSeconds(s=>s+5)} className="px-3 py-2 bg-emerald-50 text-emerald-600 rounded-xl font-black text-sm active:scale-95">+5</button>
                </div>
                <button onClick={start} className="w-full py-3 bg-lime-500 text-white rounded-2xl font-black text-base active:scale-95 shadow-lg shadow-lime-200">
                    ▶ התחל פלאנק
                </button>
            </>) : (<>
                <div className="text-center mb-3">
                    <div className="text-6xl font-black tabular-nums" style={{color}}>{remaining}</div>
                    <div className="text-[11px] font-bold text-slate-400 mt-1">שניות</div>
                </div>
                <div className="h-4 bg-slate-200 rounded-full overflow-hidden mb-3 shadow-inner">
                    <div className="h-full rounded-full transition-all duration-1000" style={{width:`${pct}%`, background:color}} />
                </div>
                <button onClick={stop} className="w-full py-3 bg-slate-700 text-white rounded-2xl font-black text-base active:scale-95">
                    ⏹ עצור
                </button>
            </>)}
        </div>
    );
}

// ─── DevNoteButton — כפתור "הערת שיפור" גנרי לכל עמוד באפליקציה ─────
// נשמר במפורש בסגירה (לא מסתמך רק על onBlur). הכותרת (pageLabel) מוצגת בפאנל בלבד, לא מוזרקת לטקסט.
function DevNoteButton({ noteKey, pageLabel, devNotes={}, onSaveDevNote, className='', dark=true, square=false }) {
    const [open, setOpen] = useState(false);
    const [text, setText] = useState('');
    const hasNote = !!(devNotes[noteKey] && devNotes[noteKey].trim());

    const taRef = React.useRef(null);
    const openPanel = () => {
        const existing = devNotes[noteKey] || '';
        const next = existing ? existing + '\n\n' : '';
        setText(next);
        setOpen(true);
        setTimeout(() => { if (taRef.current) { taRef.current.focus(); taRef.current.setSelectionRange(next.length, next.length); } }, 0);
    };
    const closePanel = () => {
        onSaveDevNote?.(noteKey, text);
        setOpen(false);
    };

    if (!onSaveDevNote) return null;
    return (
        <div className={`relative ${className}`}>
            <button onClick={()=>{ open ? closePanel() : openPanel(); }}
                className={`relative active:scale-90 shadow transition-all flex items-center justify-center
                    ${square ? 'w-8 h-8 rounded-lg' : 'p-2 rounded-full'}
                    ${hasNote ? 'bg-amber-400 text-white' : dark ? 'backdrop-blur-xl bg-white/10 text-white' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="BookOpen" size={square ? 15 : 18} />
                {hasNote && <span className="absolute -top-0.5 -left-0.5 w-2 h-2 rounded-full bg-red-500" />}
            </button>
            {open && (
                <div className="absolute left-0 top-full mt-2 w-72 bg-white rounded-2xl p-3 shadow-2xl z-[950]" dir="rtl">
                    <div className="text-[11px] font-black text-amber-600 mb-1">{pageLabel}</div>
                    <textarea ref={taRef} value={text} onChange={e=>setText(e.target.value)} onBlur={()=>onSaveDevNote(noteKey, text)}
                        rows={4} placeholder="הערת שיפור..."
                        className="w-full text-[13px] font-bold text-slate-700 bg-amber-50 border border-amber-200 rounded-xl p-2 outline-none resize-none" />
                    <button onClick={closePanel} className="mt-1.5 text-[11px] font-black text-slate-500 active:text-slate-700">סגור ושמור</button>
                </div>
            )}
        </div>
    );
}

function ExerciseEntryRow({ ex, logs, sessionStartTime, onSave, onFinish, isLast, isSuperset, restTimer, restTimerTotal, onWarmupOpened=null,
    forceSet1Disabled=false, forceSet2Disabled=false, prevRestTimer=0, prevRestTimerTotal=0, accentColor='#3b82f6', requestConfirm=null,
    weightStep=0.5, weightJumpSteps=[0.5,1,5], repsStep=1, repsJumpSteps=[1,2,3,5], weightValues=null, warmupEmbed=false,
    historyOpen=false, onToggleHistory=null, onDeleteLog=null, warmupOpen=false, onToggleWarmup=null }) {
    const isTimerEx = TIMER_EXERCISES.has(ex.id);
    const defW = DEFAULT_STARTING_WEIGHTS[ex.id] ?? (weightValues ? weightValues[0] : 10);
    const defR = DEFAULT_STARTING_REPS[ex.id] ?? 10;
    const [s1, setS1] = useState({ w:defW, r:defR, wC:false, rC:false });
    const [s2, setS2] = useState({ w:defW, r:defR, wC:false, rC:false });
    const setWarmupOpen = (v) => onToggleWarmup?.(v);
    const [sW, setSW] = useState({ w:defW, r:10, wC:false, rC:false });

    const weightPresets = useMemo(() => [...new Set(
        [...logs].filter(l=>l.exId===ex.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))
            .slice(0,30).map(l=>l.weight).filter(w=>w>0)
    )].slice(0,5), [logs, ex.id]);

    const repsPresets = useMemo(() => [...new Set(
        [...logs].filter(l=>l.exId===ex.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))
            .slice(0,30).map(l=>l.reps).filter(r=>r>0)
    )].slice(0,5), [logs, ex.id]);
    const [isSaving, setIsSaving] = useState(false);
    const [bellyTimerSecs, setBellyTimerSecs] = useState(()=>LS.get('gym-belly-timer',60));
    const [timerState, setTimerState] = useState(null); // {num,remaining,total}
    const timerIntervalRef = React.useRef(null);
    const s1Ref = React.useRef(null); const s2Ref = React.useRef(null);

    const cameBack    = React.useRef(false);
    const initialized = React.useRef(false);
    // זיהוי "חזרה" לתרגיל שכבר הסתיים לפני כן
    useEffect(() => { if (done.s1 && done.s2) cameBack.current = true; }, []); // eslint-disable-line
    useEffect(() => {
        if (initialized.current || logs.length === 0) return;
        const exLogs = [...logs].filter(l=>l.exId===ex.id)
            .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
        const lastS1 = exLogs.find(l=>l.setNum===1);
        const lastS2 = exLogs.find(l=>l.setNum===2);
        if (!lastS1 && !lastS2) return;
        if (lastS1) setS1(p=>({...p, w:lastS1.weight, r:lastS1.reps}));
        if (lastS2) setS2(p=>({...p, w:lastS2.weight, r:lastS2.reps}));
        else if (lastS1) setS2(p=>({...p, w:lastS1.weight, r:lastS1.reps}));
        const bestW = Math.max(lastS1?.weight||0, lastS2?.weight||0);
        if (bestW > 0) {
            const warmW = weightValues
                ? (()=>{ const target=bestW*0.85; return weightValues.reduce((prev,curr)=>Math.abs(curr-target)<Math.abs(prev-target)?curr:prev); })()
                : parseFloat((Math.round(bestW*0.85/weightStep)*weightStep).toFixed(4));
            setSW(p=>({...p, w:warmW}));
        }
        initialized.current = true;
    }, [logs, ex.id]);

    useEffect(() => {
        initialized.current = false;
        setS1(p=>({...p,wC:false,rC:false}));
        setS2(p=>({...p,wC:false,rC:false}));
    }, [sessionStartTime]);

    // refs עדכניים לשימוש בסגירת הטיימר
    useEffect(()=>{ s1Ref.current = s1; },[s1]);
    useEffect(()=>{ s2Ref.current = s2; },[s2]);
    // interval של טיימר בטן — ויזואלי בלבד, ללא שמירה אוטומטית
    useEffect(()=>{
        if (!timerState) { clearInterval(timerIntervalRef.current); return; }
        clearInterval(timerIntervalRef.current);
        timerIntervalRef.current = setInterval(()=>{
            setTimerState(prev=>{
                if (!prev) { clearInterval(timerIntervalRef.current); return null; }
                if (prev.remaining <= 1) {
                    clearInterval(timerIntervalRef.current);
                    playRestCompleteSound();
                    if (window.speechSynthesis) {
                        const u = new SpeechSynthesisUtterance('סיום');
                        u.lang = 'he-IL'; u.rate = 1.0; u.volume = 1.0;
                        window.speechSynthesis.speak(u);
                    }
                    return null; // חוזר לברירת המחדל (bellyTimerSecs)
                }
                if (prev.remaining <= 4) playCountdownBeep();
                return {...prev, remaining: prev.remaining-1};
            });
        },1000);
        return ()=>clearInterval(timerIntervalRef.current);
    },[timerState?.num, !!timerState]);

    const done = useMemo(() => ({
        sW: logs.some(l => l.exId===ex.id && l.setNum===0 && new Date(l.timestamp).getTime()>sessionStartTime),
        s1: logs.some(l => l.exId===ex.id && l.setNum===1 && new Date(l.timestamp).getTime()>sessionStartTime),
        s2: logs.some(l => l.exId===ex.id && l.setNum===2 && new Date(l.timestamp).getTime()>sessionStartTime)
    }), [logs, ex.id, sessionStartTime]);

    const stepW = useCallback((w, dir) => {
        if (!weightValues) return parseFloat((dir>0?Math.min(250,w+weightStep):Math.max(0,w-weightStep)).toFixed(4));
        const idx = weightValues.findIndex(v=>Math.abs(v-w)<0.01);
        const si  = idx>=0?idx:weightValues.reduce((b,v,i)=>Math.abs(v-w)<Math.abs(weightValues[b]-w)?i:b,0);
        return weightValues[Math.max(0,Math.min(weightValues.length-1,si+dir))];
    },[weightValues,weightStep]);

    const handleSetSave = async (num, state, skipConfirm=false) => {
        const isDoneSet = num===1 ? done.s1 : done.s2;
        const doSave = async () => {
            setIsSaving(true);
            try {
                await onSave(ex.id, num, state.w, state.r, isSuperset);
                if (!isDoneSet) {
                    if (num===1 && !done.s2) setS2(p=>({...p, w: state.w}));
                    if (num===2 && isLast) setTimeout(()=>onFinish(true), 800);
                }
                if (num===1) setS1(p=>({...p,wC:false,rC:false}));
                else setS2(p=>({...p,wC:false,rC:false}));
            } finally { setIsSaving(false); }
        };
        if (!skipConfirm && cameBack.current && requestConfirm) {
            requestConfirm('לשנות את נתוני הסט?', doSave);
        } else {
            await doSave();
        }
    };

    const handleSkipSet = async (num) => {
        setIsSaving(true);
        try {
            await onSave(ex.id, num, 0, 0, isSuperset);
            if (num === 1) setS2({w:0, r:0, wC:false, rC:false});
            if (num===2 && isLast) setTimeout(()=>onFinish(true), 800);
        } finally { setIsSaving(false); }
    };

    const betweenTimer = done.s1 && !done.s2 && restTimerTotal > 0 && !forceSet2Disabled;

    const conicStyle = (rt, tot) => {
        if (!tot) return null;
        if (rt === 0) return { border:`4px solid ${accentColor}`, borderRadius:'1.6rem', boxShadow:`0 2px 12px ${accentColor}40` };
        const deg = (rt / tot) * 360;
        return {
            border:'4px solid transparent', borderRadius:'1.6rem',
            background:`linear-gradient(white,white) padding-box, conic-gradient(from -90deg, ${accentColor} 0deg, ${accentColor} ${deg}deg, #e2e8f0 ${deg}deg, #e2e8f0 360deg) border-box`
        };
    };

    const handleWarmupSave = async () => {
        setIsSaving(true);
        try {
            await onSave(ex.id, 0, sW.w, sW.r, isSuperset);
            setSW(p=>({...p,wC:false,rC:false}));
        } finally { setIsSaving(false); }
    };

    const hist10 = useMemo(() => [...logs].filter(l=>l.exId===ex.id)
        .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,10), [logs, ex.id]);
    const histDateKeys = useMemo(() => [...new Set(hist10.map(h=>new Date(h.timestamp).toLocaleDateString('he-IL')))], [hist10]);
    const histPalettes = ['bg-indigo-50 border-indigo-200 text-indigo-700','bg-violet-50 border-violet-200 text-violet-700','bg-sky-50 border-sky-200 text-sky-700','bg-teal-50 border-teal-200 text-teal-700'];

    return (
        <div className="space-y-0" dir="rtl">
            {historyOpen && hist10.length > 0 && (
                <div className="mb-3 bg-slate-50 rounded-2xl border border-slate-100 p-3 space-y-1.5">
                    {hist10.map((h,i)=>{
                        const dateStr = new Date(h.timestamp).toLocaleDateString('he-IL');
                        const pal = histPalettes[histDateKeys.indexOf(dateStr) % histPalettes.length];
                        return (
                            <div key={h.id||i} className={`flex items-center justify-between px-3 py-2 rounded-2xl border text-[11px] ${pal}`}>
                                <div className="flex items-center gap-2">
                                    {onDeleteLog && requestConfirm && (
                                        <button onClick={()=>requestConfirm('למחוק סט זה?',()=>onDeleteLog(h.id))}
                                            className="text-red-300 active:text-red-500 shrink-0">
                                            <Icon name="Trash2" size={12} />
                                        </button>
                                    )}
                                    <span className="font-bold opacity-70">{getDayNameHe(h.timestamp)} {dateStr}</span>
                                </div>
                                <span className="font-black">סט {h.setNum}: {h.weight}kg × {h.reps}</span>
                            </div>
                        );
                    })}
                </div>
            )}
            <div id={`sets-area-${ex.id}`}>
            {/* סט חימום */}
            {(warmupOpen || done.sW) && (()=>{
                const isDoneW = done.sW;
                const dimDoneW = isDoneW && !(sW.wC || sW.rC);
                return (
                    <React.Fragment>
                        <div style={dimDoneW ? {border:'2px solid #d97706', borderRadius:'1.6rem', filter:'grayscale(0.85) opacity(0.65)'} : isDoneW ? {border:'2px solid #d97706', borderRadius:'1.6rem'} : {border:'2px dashed #f59e0b', borderRadius:'1.6rem', boxShadow:'0 2px 8px rgba(245,158,11,0.15)'}}
                            className={`p-2.5 rounded-[1.6rem] flex items-center gap-2 transition-all ${isDoneW ? 'bg-amber-50' : 'bg-amber-50/70'}`}>
                            <div className="w-8 h-12 rounded-xl flex flex-col items-center justify-center shrink-0 shadow-lg cursor-pointer"
                                style={{background: isDoneW ? '#92400e' : '#f59e0b'}}
                                onClick={()=>{if(!isDoneW) setWarmupOpen(false);}}>
                                <span className="text-[6px] font-black uppercase tracking-tighter text-white/80">WARM</span>
                                <span className="text-xs font-black leading-none text-white">🔥</span>
                            </div>
                            <div className="flex flex-1 gap-1.5">
                                <div className="flex items-stretch flex-1 gap-0.5">
                                    <button onClick={()=>setSW(p=>({...p,w:stepW(p.w,1),wC:true}))}
                                        className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-2xl active:bg-emerald-100 shrink-0 flex items-center justify-center">+</button>
                                    <Roller label="ק״ג" min={0} max={250} step={weightStep} drumStep={weightValues?null:1} value={sW.w} isChanged={sW.wC}
                                        onChange={v=>{setSW(p=>({...p,w:v,wC:true}));}}
                                        presets={weightPresets} jumpSteps={weightValues?[1,2,3]:weightJumpSteps} values={weightValues} />
                                    <button onClick={()=>setSW(p=>({...p,w:stepW(p.w,-1),wC:true}))}
                                        className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-2xl active:bg-rose-100 shrink-0 flex items-center justify-center">−</button>
                                </div>
                                <div className="flex items-stretch flex-1 gap-0.5">
                                    <button onClick={()=>setSW(p=>({...p,r:Math.min(120,p.r+repsStep),rC:true}))}
                                        className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-2xl active:bg-emerald-100 shrink-0 flex items-center justify-center">+</button>
                                    <Roller label="חזרות" min={1} max={120} step={repsStep} value={sW.r} isChanged={sW.rC}
                                        onChange={v=>setSW(p=>({...p,r:v,rC:true}))}
                                        presets={repsPresets} jumpSteps={repsJumpSteps} />
                                    <button onClick={()=>setSW(p=>({...p,r:Math.max(1,p.r-repsStep),rC:true}))}
                                        className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-2xl active:bg-rose-100 shrink-0 flex items-center justify-center">−</button>
                                </div>
                            </div>
                            <button onClick={handleWarmupSave}
                                disabled={isSaving}
                                className={`w-14 h-12 rounded-2xl flex items-center justify-center font-black text-[14px] transition-all active:scale-95 shrink-0
                                    ${isDoneW && (sW.wC||sW.rC) ? 'bg-amber-100 text-amber-700 shadow-amber-100 shadow-md'
                                    : isDoneW ? 'bg-amber-100 text-amber-400 shadow-none'
                                    : 'bg-amber-500 text-white shadow-amber-200 shadow-lg'}`}>
                                {isDoneW && (sW.wC||sW.rC) ? 'עדכן' : isDoneW ? 'בוצע' : isSaving ? '...' : 'סיום'}
                            </button>
                        </div>
                        <div className="h-1.5" />
                    </React.Fragment>
                );
            })()}
            {[1,2].map((num) => {
                const state    = num===1 ? s1 : s2;
                const setState = num===1 ? setS1 : setS2;
                const isDone   = num===1 ? done.s1 : done.s2;
                const canAct   = !isSaving && (isDone ? true : (num===1 ? !forceSet1Disabled : (done.s1 && !forceSet2Disabled)));
                // סופרסט: Set2 ממתין לטיימר של התרגיל האחר — מציג ספירה לאחור
                const isCrossTimerSet2 = num===2 && !isDone && done.s1 && forceSet2Disabled && prevRestTimerTotal > 0 && prevRestTimer > 0;
                // מנוחה בין חימום לסט 1: משתמשת באותו טיימר (restTimer/restTimerTotal) של התרגיל עצמו
                const warmupToS1 = done.sW && !done.s1 && restTimerTotal > 0;
                const hasConic1  = num===1 && !done.s1 && (prevRestTimerTotal > 0 || warmupToS1);
                const conic1Rt   = prevRestTimerTotal > 0 ? prevRestTimer      : restTimer;
                const conic1Tot  = prevRestTimerTotal > 0 ? prevRestTimerTotal : restTimerTotal;
                const hasConic2 = num===2 && (betweenTimer || isCrossTimerSet2);
                const conicRt   = hasConic2 ? (betweenTimer ? restTimer        : prevRestTimer)        : 0;
                const conicTot  = hasConic2 ? (betweenTimer ? restTimerTotal   : prevRestTimerTotal)   : 0;
                const conic     = hasConic1 ? conicStyle(conic1Rt, conic1Tot)
                                : hasConic2 ? conicStyle(conicRt, conicTot)
                                : null;
                const countdown  = hasConic1 ? conic1Rt : hasConic2 ? conicRt : 0;
                const showCDown  = !isDone && countdown > 0;
                const timerDone  = !isDone && !conic && (
                    (hasConic1 && conic1Rt===0 && conic1Tot>0) ||
                    (num===2 && betweenTimer && restTimer===0)
                );
                // כל עוד החימום פתוח וטרם הושלם — סט 1 אינו "הסט הבא" ולא אמור להיות מסומן כפעיל
                const warmupPending = warmupOpen && !done.sW;
                const isActive    = !conic && canAct && !(num===1 && warmupPending);
                const canActFinal = canAct || showCDown;
                const dimDone     = isDone && !(state.wC || state.rC);
                return (
                    <React.Fragment key={num}>
                        <div style={{...(conic || (isActive ? {border:`2px solid ${accentColor}`, boxShadow:`0 4px 16px ${accentColor}30`, borderRadius:'1.6rem'} : isDone ? {border:'2px solid #94a3b8', borderRadius:'1.6rem'} : undefined)),
                                ...(dimDone ? {filter:'grayscale(0.85) opacity(0.65)'} : {})}}
                            className={`p-2.5 rounded-[1.6rem] flex items-center gap-2 transition-all
                                ${isDone   ? 'bg-slate-300' : 'bg-white'}
                                ${conic    ? ''
                                : isActive ? ''
                                : isDone   ? ''
                                : timerDone? 'border border-slate-700 shadow-md'
                                :            'border border-slate-100 shadow-sm'}`}>
                            <div className="w-8 h-12 text-white rounded-xl flex flex-col items-center justify-center shrink-0 shadow-lg"
                                style={{background: isActive ? accentColor : '#000000'}}>
                                <span className="text-[7px] font-black uppercase tracking-tighter opacity-60">SET</span>
                                <span className="text-base font-black leading-none">{num}</span>
                            </div>
                            <div className="flex flex-1 gap-1.5">
                                <div className="flex items-stretch flex-1 gap-0.5">
                                    <button onClick={()=>setState(p=>({...p,w:stepW(p.w,1),wC:true}))}
                                        className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-2xl active:bg-emerald-100 shrink-0 flex items-center justify-center">+</button>
                                    <Roller label="ק״ג" min={0} max={250} step={weightStep} drumStep={weightValues?null:1} value={state.w} isChanged={state.wC}
                                        onChange={v=>{setState(p=>({...p,w:v,wC:true}));}}
                                        presets={weightPresets} jumpSteps={weightValues?[1,2,3]:weightJumpSteps} values={weightValues} />
                                    <button onClick={()=>setState(p=>({...p,w:stepW(p.w,-1),wC:true}))}
                                        className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-2xl active:bg-rose-100 shrink-0 flex items-center justify-center">−</button>
                                </div>
                                {/* אזור חזרות / טיימר בטן */}
                                {isTimerEx ? (
                                <div className="flex flex-col flex-1 gap-1">
                                    {(!timerState||timerState.num!==num) && !isDone && (
                                        <div className="flex gap-1">
                                            {[10,20,30,40].map(d=>{const t=bellyTimerSecs+d; return (
                                                <button key={d} onClick={()=>{setBellyTimerSecs(t);LS.set('gym-belly-timer',t);}}
                                                    className="flex-1 py-0.5 rounded-lg text-[10px] font-black active:scale-95 bg-slate-100 text-slate-600 active:bg-teal-100">
                                                    {t}″</button>
                                            );})}
                                        </div>
                                    )}
                                    <div className="flex items-stretch gap-0.5">
                                        {(!timerState||timerState.num!==num) && (
                                            <button onClick={()=>{
                                                if (isDone) { setState(p=>({...p, r:Math.max(10,(p.r||bellyTimerSecs)-10), rC:true})); return; }
                                                const v=Math.max(10,bellyTimerSecs-10);setBellyTimerSecs(v);LS.set('gym-belly-timer',v);
                                            }}
                                                className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-sm active:bg-rose-100 shrink-0 flex items-center justify-center">-10</button>
                                        )}
                                        <div onClick={()=>{
                                            if (isDone) return;
                                            if (timerState?.num===num) {
                                                clearInterval(timerIntervalRef.current); setTimerState(null);
                                            } else if (!timerState) {
                                                setTimerState({num, remaining:bellyTimerSecs, total:bellyTimerSecs});
                                            }
                                        }} className={`flex-1 h-12 rounded-xl flex flex-col items-center justify-center cursor-pointer active:scale-95
                                            ${timerState?.num===num?'bg-teal-50 ring-2 ring-teal-300':'bg-slate-100 active:bg-teal-50'}`}>
                                            <span className={`font-black text-[22px] ${timerState?.num===num?'text-teal-700':'text-slate-800'}`}>
                                                {timerState?.num===num ? timerState.remaining : (isDone ? (state.r||bellyTimerSecs) : bellyTimerSecs)}
                                            </span>
                                            <span className="text-[9px] font-black opacity-50 tracking-tighter uppercase">{timerState?.num===num?'▐▐ עצור':isDone?'שנ׳ (לחץ +/- לעדכן)':'▶ שנ׳'}</span>
                                        </div>
                                        {(!timerState||timerState.num!==num) && (
                                            <button onClick={()=>{
                                                if (isDone) { setState(p=>({...p, r:Math.min(600,(p.r||bellyTimerSecs)+10), rC:true})); return; }
                                                const v=Math.min(300,bellyTimerSecs+10);setBellyTimerSecs(v);LS.set('gym-belly-timer',v);
                                            }}
                                                className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-sm active:bg-emerald-100 shrink-0 flex items-center justify-center">+10</button>
                                        )}
                                    </div>
                                </div>
                                ) : (
                                <div className="flex items-stretch flex-1 gap-0.5">
                                    <button onClick={()=>setState(p=>({...p,r:Math.min(120,p.r+repsStep),rC:true}))}
                                        className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-2xl active:bg-emerald-100 shrink-0 flex items-center justify-center">+</button>
                                    <Roller label="חזרות" min={1} max={120} step={repsStep} value={state.r} isChanged={state.rC}
                                        onChange={v=>setState(p=>({...p,r:v,rC:true}))}
                                        presets={repsPresets} jumpSteps={repsJumpSteps} />
                                    <button onClick={()=>setState(p=>({...p,r:Math.max(1,p.r-repsStep),rC:true}))}
                                        className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-2xl active:bg-rose-100 shrink-0 flex items-center justify-center">−</button>
                                </div>
                                )}
                            </div>
                            <button onClick={() => {
                                if (!canActFinal) return;
                                if (isTimerEx) {
                                    if (timerState?.num===num) { clearInterval(timerIntervalRef.current); setTimerState(null); }
                                    handleSetSave(num, {...state, r: isDone ? (state.r||bellyTimerSecs) : bellyTimerSecs}); return;
                                }
                                handleSetSave(num, state);
                            }}
                                disabled={!canActFinal}
                                className={`w-14 h-12 rounded-2xl flex items-center justify-center font-black text-[14px] transition-all active:scale-95 shrink-0
                                    ${isDone && (state.wC||state.rC) ? 'bg-amber-100 text-amber-700 shadow-amber-100 shadow-md'
                                    : isDone    ? 'bg-slate-100 text-slate-400 shadow-none'
                                    : showCDown ? 'bg-blue-600 text-white shadow-blue-200 shadow-lg active:bg-blue-700 text-[16px]'
                                    : !canAct   ? 'bg-slate-100 text-slate-300 shadow-none'
                                    : 'bg-emerald-500 text-white shadow-emerald-200 shadow-lg'}`}>
                                {isDone && (state.wC||state.rC) ? 'עדכן'
                                : isDone ? 'בוצע'
                                : isSaving ? '...'
                                : showCDown ? countdown : 'סיום'}
                            </button>
                        </div>
                        {num===1 && <div className="h-1.5" />}
                    </React.Fragment>
                );
            })}
            </div>

        </div>
    );
}

// ─── EXERCISE_VIDEOS ───────────────────────────────────────
const EXERCISE_VIDEOS = {
    ex1:'ex1.mp4', ex2:'ex2.mp4', ex3:'ex3.mp4', ex4:'ex4.mp4',
    ex5a:'ex5a.mp4', ex5b:'ex5b.mp4', ex6:'ex6.mp4',
    ex7b:'ex7b.mp4', ex7c:'ex7c.mp4', ex8:'ex8.mp4',
    ex9:'ex9.mp4', ex10a:'ex10a.mp4', ex10b:'ex10b.mp4',
    ex12:'ex12.mp4', ex3b:'ex3b.mp4'
};

// ─── EXERCISE_IMAGES ────────────────────────────────────────

// ─── VideoModal ─────────────────────────────────────────────
let _videoModalOpen = false;

const VideoModal = ({ src, onClose }) => {
    useEffect(()=>{
        _videoModalOpen = true;
        history.pushState({gym:'video'},'');
        const handler = ()=>{ _videoModalOpen = false; onClose(); };
        window.addEventListener('popstate', handler);
        return ()=>{ _videoModalOpen = false; window.removeEventListener('popstate', handler); };
    },[]);
    return (
        <div className="fixed inset-0 z-[600] bg-black/95 flex items-center justify-center p-4" onClick={onClose}>
            <button onClick={onClose}
                className="absolute top-5 left-5 w-11 h-11 bg-white/20 rounded-full flex items-center justify-center text-white z-10 active:bg-white/40">
                <Icon name="X" size={22} />
            </button>
            <video src={src} controls autoPlay muted playsInline
                className="max-w-full max-h-full rounded-xl shadow-2xl"
                onClick={e=>e.stopPropagation()} />
        </div>
    );
};

// ─── DetailView ────────────────────────────────────────────
const DetailView = memo(function DetailView({ group, logs, notes, onSaveNote, images, onSaveImage, onRemoveImage, videos, onSaveVideo, onDeleteVideo, onBack, onFinish, onSave, sessionStartTime, restTimers, restTimerTotals, scrollToExId, onScrollDone, onDeleteLog, requestConfirm, groupIdx=0, totalGroups=1, nextGroup=null, prevGroup=null, onNavigateTo, musicList=[], musicPlaying=false, onMusicToggle=null, weightStepsOverrides={}, onOpenSummary=null, allGroupsDone=false, devNotes={}, onSaveDevNote=null,
    workoutSec=0, isWorkoutActive=false, onToggleWorkout=null, customNames={}, customHowTo={}, setCustomHowTo=null, customTips={}, setCustomTips=null, warmupEmbed={}, onUpdateSettings=null,
    allGroups=[], skippedGroups=[] }) {
    const handleWarmupOpened = (exId) => {
        if (!onUpdateSettings || warmupEmbed[exId]) return;
        onUpdateSettings('warmupEmbed', {...warmupEmbed, [exId]: true});
    };
    const [lightbox,      setLightbox]     = useState(null);
    const [previewGroupId, setPreviewGroupId] = useState(null);
    const previewTimeoutRef = React.useRef(null);
    const curChipRef = React.useRef(null);
    useEffect(() => {
        setPreviewGroupId(null);
        if (previewTimeoutRef.current) clearTimeout(previewTimeoutRef.current);
        setTimeout(()=>curChipRef.current?.scrollIntoView({behavior:'smooth', inline:'start', block:'nearest'}), 50);
    }, [group.id]);
    const [videoModal,    setVideoModal]   = useState(null);
    const [playingVideos, setPlayingVideos]= useState({});
    const [showDetails,   setShowDetails]  = useState(()=>{
        const saved = LS.get('gym-show-details', null);
        if (saved) return saved;
        return group.exercises.reduce((acc,ex)=>({...acc,[ex.id]:!group.isSuperset}),{});
    });
    const [historyOpen, setHistoryOpen] = useState(()=>LS.get('gym-hist-open', {}));
    useEffect(()=>{ LS.set('gym-hist-open', historyOpen); },[historyOpen]);
    const [warmupOpenMap, setWarmupOpenMap] = useState({});
    const [editingHowToId, setEditingHowToId] = useState(null);
    const [howToEditVal, setHowToEditVal] = useState('');
    const [editingTipKey, setEditingTipKey] = useState(null); // 'exId:index'
    const [tipEditVal, setTipEditVal] = useState('');
    const scrollRef = React.useRef(null);
    useEffect(()=>{ LS.set('gym-show-details', showDetails); },[showDetails]);

    // כניסה לתרגיל: תמיד מתחילים מראש הדף (כותרת + תמונה גלויים)
    useEffect(()=>{
        setTimeout(()=>{ scrollRef.current?.scrollTo({ top: 0, behavior: 'auto' }); }, 30);
    }, [group.id]);

    useEffect(()=>{
        if (!scrollToExId) return;
        setShowDetails(p => ({...p, [scrollToExId]: false}));
        const doScroll = () => {
            // תרגיל ראשון בקבוצה: גלול לראש הדף כדי שהכותרת והתמונה יהיו גלויים במלואם
            if (scrollToExId === group.exercises[0].id) {
                scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            const el = scrollRef.current?.querySelector(`#ex-row-${scrollToExId}`);
            if (el && scrollRef.current) {
                const offset = el.offsetTop - scrollRef.current.getBoundingClientRect().top +
                               scrollRef.current.scrollTop;
                scrollRef.current.scrollTo({ top: Math.max(0, offset - 160), behavior:'smooth' });
            }
        };
        setTimeout(doScroll, 60);
        onScrollDone?.();
    }, [scrollToExId]);

    // ── renderEx: מרנדר בלוק תרגיל אחד ──
    const renderEx = (ex, exIdx, { isLast=false, isSuperset:exIsSuperset=false,
        forceSet1Disabled=false, forceSet2Disabled=false,
        prevRestTimer=0, prevRestTimerTotal=0 } = {}) => {
        const accentHex  = group.hex || '#3b82f6';
        const isTimerEx  = TIMER_EXERCISES.has(ex.id);
        // exHistory מנוהל inline בבלוק ההיסטוריה הcollapsible
        const imgSrc     = images?.[ex.id];
        const staticImg  = EXERCISE_IMAGES[ex.id];
        const dispImgSrc = imgSrc || (staticImg ? `images/${staticImg}` : null);
        const isPersonal = !!imgSrc;
        const youtubeId  = videos?.[ex.id];
        const localVid   = EXERCISE_VIDEOS[ex.id];
        const hasVideo   = youtubeId || localVid;
        // skip active set
        const doneS1Ex = logs.some(l=>l.exId===ex.id&&l.setNum===1&&new Date(l.timestamp).getTime()>sessionStartTime);
        const doneS2Ex = logs.some(l=>l.exId===ex.id&&l.setNum===2&&new Date(l.timestamp).getTime()>sessionStartTime);
        // משקל הסט הבא שטרם בוצע — מוצג בכתום ליד התמונה, ובסוגריים משקל החימום (אם קיים)
        const lastW = getLastDisplayWeight(ex.id, logs);
        const warmupW = getLastWarmupWeight(ex.id, logs);

        // טיימר prev — רק מתרגיל בקבוצה הנוכחית (לא לעבור בין קבוצות)
        let fPrevRt = prevRestTimer, fPrevTot = prevRestTimerTotal;

        const skipActiveNum = !doneS1Ex ? 1 : !doneS2Ex ? 2 : null;
        const handleHowToSkip = skipActiveNum ? () => {
            onSave(ex.id, skipActiveNum, 0, 0, exIsSuperset);
            if (skipActiveNum===2 && isLast) setTimeout(()=>onFinish(true), 800);
        } : null;

        const videoBtn = (full) => youtubeId ? (
            <div className="flex flex-col gap-1 h-full">
                <a href={`https://youtu.be/${youtubeId}`} target="_blank" rel="noopener noreferrer"
                    className={`flex-1 flex flex-col items-center justify-center gap-1 bg-red-50 border border-red-200 text-red-600 rounded-2xl font-black active:scale-95`}
                    style={{minHeight: full ? '5rem' : '3.5rem'}}>
                    <span className="text-2xl">▶</span><span className="text-[11px]">YouTube</span>
                </a>
                <button onClick={()=>onDeleteVideo(ex.id)} className="text-center text-[9px] font-black text-slate-300 active:text-red-400 py-0.5">הסר</button>
            </div>
        ) : localVid ? (
            <button onClick={()=>setVideoModal(`videos/${localVid}`)}
                className="flex-1 flex flex-col items-center justify-center gap-1 bg-slate-800 border border-slate-700 text-white rounded-2xl font-black active:scale-95"
                style={{minHeight: full ? '5rem' : '3.5rem'}}>
                <span className="text-2xl">▶</span><span className="text-[11px]">סרטון</span>
            </button>
        ) : null;

        // טיימר כולל של האימון (כמו בדף הראשי) — מוצג בחצי אזור הווידאו
        const wTimerStr = `${String(Math.floor(workoutSec/60)).padStart(2,'0')}:${String(workoutSec%60).padStart(2,'0')}`;
        const miniTimer = (
            <button onClick={()=>onToggleWorkout&&onToggleWorkout()}
                className={`flex-1 flex flex-col items-center justify-center gap-1 rounded-2xl font-black active:scale-95 border transition-colors
                    ${isWorkoutActive ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-200 border-slate-300 text-slate-600'}`}>
                <Icon name={isWorkoutActive?'Pause':'Play'} size={18} />
                <span className="font-mono text-[15px] font-black tracking-widest leading-none" dir="ltr">{wTimerStr}</span>
            </button>
        );

        return (
            <div key={ex.id} id={`ex-row-${ex.id}`} className="border-b border-slate-100 pb-2 last:border-0">
                {/* תמונה + וידאו */}
                {exIsSuperset ? (
                    /* סופרסט: שמאל = כותרת + תמונה, ימין = וידאו */
                    <div className="flex gap-2 mb-0" style={{minHeight:'7rem'}}>
                        <div className="flex-1 flex flex-col gap-1.5 min-w-0">
                            <div className="text-sm font-black text-slate-800 leading-tight px-0.5">{customNames[ex.id] || ex.title}</div>
                            {dispImgSrc && (
                                <div className="relative flex-1 min-w-0">
                                    <img src={dispImgSrc} alt={ex.title} onClick={()=>setLightbox(dispImgSrc)}
                                        className="w-full h-full rounded-2xl object-cover shadow cursor-pointer active:opacity-80" style={{maxHeight:'5rem'}} />
                                    {isPersonal && <button onClick={()=>onRemoveImage(ex.id)}
                                        className="absolute top-1.5 left-1.5 bg-white/90 text-red-400 rounded-full px-2 py-0.5 text-[9px] font-black shadow">הסר</button>}
                                </div>
                            )}
                            {!dispImgSrc && (
                                <label className="flex items-center gap-1 text-[10px] font-black text-slate-400 cursor-pointer">
                                    <input type="file" accept="image/*" className="hidden" onChange={e=>onSaveImage(ex.id,e.target.files[0])} />
                                    📷 הוסף תמונה
                                </label>
                            )}
                        </div>
                        <div className="flex-1 flex gap-1.5">
                            {hasVideo && <div className="flex-1 min-w-0 flex flex-col">{videoBtn(false)}</div>}
                            <div className="flex-1 min-w-0 flex flex-col">{miniTimer}</div>
                        </div>
                    </div>
                ) : (
                    /* תרגיל רגיל */
                    <>
                        {(
                            <div className="flex gap-2 mb-0">
                                {dispImgSrc && (
                                    <div className="relative flex-1 min-w-0">
                                        <img src={dispImgSrc} alt={ex.title} onClick={()=>setLightbox(dispImgSrc)}
                                            className="w-full rounded-2xl object-cover shadow cursor-pointer active:opacity-80" style={{maxHeight:'7.5rem'}} />
                                        {isPersonal && <button onClick={()=>onRemoveImage(ex.id)}
                                            className="absolute top-1.5 left-1.5 bg-white/90 text-red-400 rounded-full px-2 py-0.5 text-[9px] font-black active:text-red-600 shadow">הסר</button>}
                                    </div>
                                )}
                                <div className={`grid grid-cols-2 grid-rows-2 gap-1.5 ${dispImgSrc ? 'w-[38%] shrink-0' : 'flex-1'}`} style={{height:'7.5rem'}}>
                                    <div className="min-w-0 flex flex-col">{hasVideo ? videoBtn(false) : <div className="flex-1 bg-slate-50 border border-slate-100 rounded-2xl" />}</div>
                                    <div className="min-w-0 flex flex-col">{miniTimer}</div>
                                    {lastW>0 ? (
                                        <div className="bg-orange-50 border border-orange-200 rounded-2xl flex flex-col items-center justify-center shadow-sm">
                                            <span className="text-3xl font-black text-orange-500 leading-none">{lastW}</span>
                                            {warmupW>0 && <span className="text-[10px] font-black text-orange-300 leading-none mt-0.5">({warmupW})</span>}
                                            <span className="text-[10px] font-black text-orange-400 mt-0.5">ק״ג</span>
                                        </div>
                                    ) : <div className="bg-slate-50 border border-slate-100 rounded-2xl" />}
                                    <div className="bg-slate-50 border border-slate-100 rounded-2xl" />
                                </div>
                            </div>
                        )}
                        {!dispImgSrc && (
                            <label className="flex items-center gap-1.5 text-[11px] font-black text-slate-400 cursor-pointer mt-2">
                                <input type="file" accept="image/*" className="hidden" onChange={e=>onSaveImage(ex.id,e.target.files[0])} />
                                📷 הוסף תמונה שלך
                            </label>
                        )}
                    </>
                )}
                {/* שורה מאוחדת: איך לבצע / היסטוריה / חימום / דלג */}
                <div className="flex items-center gap-1.5 mt-2 mb-1.5">
                    <button onClick={()=>setShowDetails(p=>({...p,[ex.id]:!p[ex.id]}))}
                        className={`flex-1 flex items-center justify-center gap-1 px-2 py-1.5 rounded-xl text-[11px] font-black active:scale-95 transition-all
                            ${showDetails[ex.id] ? 'bg-blue-100 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-600'}`}>
                        <Icon name="BookOpen" size={13} /> איך לבצע
                    </button>
                    <button onClick={()=>setHistoryOpen(p=>({...p,[ex.id]:!p[ex.id]}))}
                        className={`flex-1 flex items-center justify-center gap-1 px-2 py-1.5 rounded-xl text-[11px] font-black active:scale-95 transition-all
                            ${historyOpen[ex.id] ? 'bg-indigo-100 text-indigo-700 border border-indigo-200' : 'bg-slate-100 text-slate-600'}`}>
                        <Icon name="History" size={13} /> היסטוריה
                    </button>
                    <button onClick={()=>setWarmupOpenMap(p=>{
                            const next = !(p[ex.id] ?? !!warmupEmbed[ex.id]);
                            if (next) handleWarmupOpened(ex.id);
                            return {...p,[ex.id]:next};
                        })}
                        className={`flex-1 flex items-center justify-center gap-1 px-2 py-1.5 rounded-xl text-[11px] font-black active:scale-95 transition-all
                            ${(warmupOpenMap[ex.id] ?? !!warmupEmbed[ex.id]) ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-slate-100 text-slate-600'}`}>
                        🔥 חימום
                    </button>
                    {handleHowToSkip && (
                        <button onClick={handleHowToSkip}
                            className="flex-1 flex items-center justify-center px-2 py-1.5 rounded-xl bg-orange-50 border border-orange-200 text-orange-500 text-[11px] font-black active:scale-95">
                            דלג
                        </button>
                    )}
                </div>
                {/* how-to */}
                <section className="bg-slate-50 rounded-3xl border border-slate-100 mb-2 shadow-inner overflow-hidden">
                    {showDetails[ex.id] && (
                        <div className="px-4 pb-4">
                            {(()=>{
                                const tips = customTips[ex.id] || ex.tips;
                                const updateTips = (newTips) => setCustomTips(prev=>({...prev,[ex.id]:newTips}));
                                const addTip = () => {
                                    const nt = [...tips, ''];
                                    updateTips(nt);
                                    setEditingTipKey(`${ex.id}:${tips.length}`);
                                    setTipEditVal('');
                                };
                                return editingHowToId === ex.id ? (
                                <div className="mb-3">
                                    <textarea value={howToEditVal} onChange={e=>setHowToEditVal(e.target.value)} autoFocus
                                        rows={3}
                                        onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
                                        ref={el=>{if(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}}}
                                        className="w-full bg-white border border-blue-200 rounded-2xl p-3 text-[13px] font-medium text-slate-700 outline-none focus:ring-2 focus:ring-blue-400 resize-none overflow-hidden mb-2" />
                                    <div className="flex gap-2">
                                        <button onClick={()=>{
                                            if (howToEditVal.trim() && howToEditVal.trim() !== ex.howTo) setCustomHowTo(prev=>({...prev,[ex.id]:howToEditVal.trim()}));
                                            else { setCustomHowTo(prev=>{const c={...prev}; delete c[ex.id]; return c;}); }
                                            setEditingHowToId(null);
                                        }} className="flex-1 py-2 bg-blue-600 text-white rounded-xl text-[12px] font-black active:scale-95">שמור</button>
                                        <button onClick={()=>setEditingHowToId(null)} className="px-4 py-2 bg-slate-100 text-slate-500 rounded-xl text-[12px] font-black active:scale-95">ביטול</button>
                                        {customHowTo[ex.id] && (
                                            <button onClick={()=>{setCustomHowTo(prev=>{const c={...prev};delete c[ex.id];return c;});setEditingHowToId(null);}}
                                                className="px-3 py-2 bg-rose-50 text-rose-500 rounded-xl text-[11px] font-black active:scale-95">איפוס</button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div className="relative mb-3">
                                    <p className="text-[13px] text-slate-600 leading-relaxed bg-white/60 p-3 rounded-2xl border border-slate-200/50 font-medium">
                                        {customHowTo[ex.id] || ex.howTo}
                                    </p>
                                    <div className="absolute top-2 left-2 flex items-center gap-2.5">
                                        <button onClick={addTip}
                                            className="w-7 h-7 bg-white/90 border border-emerald-200 rounded-full flex items-center justify-center text-emerald-500 active:scale-90 shadow-sm">
                                            <Icon name="Plus" size={13} />
                                        </button>
                                        <button onClick={()=>{setEditingHowToId(ex.id);setHowToEditVal(customHowTo[ex.id]||ex.howTo);}}
                                            className="w-7 h-7 bg-white/90 border border-slate-200 rounded-full flex items-center justify-center text-blue-400 active:scale-90 shadow-sm">
                                            <span className="text-[12px]">✏️</span>
                                        </button>
                                    </div>
                                </div>
                            );})()}
                            <div className="flex flex-wrap gap-2 mb-3">
                                {(()=>{
                                    const tips = customTips[ex.id] || ex.tips;
                                    const updateTips = (newTips) => setCustomTips(prev=>({...prev,[ex.id]:newTips}));
                                    return (<>
                                        {tips.map((t,i)=>{
                                            const tipKey = `${ex.id}:${i}`;
                                            if (editingTipKey === tipKey) return (
                                                <div key={i} className="flex items-center gap-1 w-full">
                                                    <input value={tipEditVal} onChange={e=>setTipEditVal(e.target.value)} autoFocus
                                                        className="flex-1 bg-white border border-blue-200 rounded-xl px-2.5 py-1.5 text-[11px] font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-400"
                                                        onKeyDown={e=>{if(e.key==='Enter'){const nt=[...tips];nt[i]=tipEditVal.trim()||t;updateTips(nt);setEditingTipKey(null);}}} />
                                                    <button onClick={()=>{const nt=[...tips];nt[i]=tipEditVal.trim()||t;updateTips(nt);setEditingTipKey(null);}}
                                                        className="px-2 py-1.5 bg-blue-600 text-white rounded-xl text-[10px] font-black active:scale-95 shrink-0">✓</button>
                                                    <button onClick={()=>setEditingTipKey(null)}
                                                        className="px-2 py-1.5 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-black active:scale-95 shrink-0">✕</button>
                                                </div>
                                            );
                                            return (
                                                <div key={i} className="bg-white p-2 rounded-xl border border-slate-100 text-[11px] text-slate-600 flex items-start gap-1.5 shadow-sm group">
                                                    <Icon name="CheckCircle2" size={13} className="text-emerald-500 mt-0.5 shrink-0" />
                                                    <span className="font-bold flex-1">{t}</span>
                                                    <button onClick={()=>{setEditingTipKey(tipKey);setTipEditVal(t);}}
                                                        className="text-blue-300 active:text-blue-500 shrink-0 mt-0.5"><span className="text-[10px]">✏️</span></button>
                                                    <button onClick={()=>{const nt=tips.filter((_,j)=>j!==i);updateTips(nt);}}
                                                        className="text-red-300 active:text-red-500 shrink-0 mt-0.5"><Icon name="X" size={11}/></button>
                                                </div>
                                            );
                                        })}
                                    </>);
                                })()}
                            </div>
                            <textarea defaultValue={notes?.[ex.id]||''} onBlur={e=>onSaveNote(ex.id,e.target.value)}
                                placeholder="הוסף דגשים והערות אישיות..."
                                rows={1}
                                onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
                                ref={el=>{if(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}}}
                                className="w-full bg-amber-50/60 border border-amber-200/60 rounded-xl p-3 text-[13px] font-bold text-slate-700 outline-none focus:ring-2 focus:ring-amber-400 resize-none overflow-hidden" />
                        </div>
                    )}
                    {!showDetails[ex.id] && notes?.[ex.id] && (
                        <div className="px-4 pb-3">
                            <textarea defaultValue={notes[ex.id]} onBlur={e=>onSaveNote(ex.id,e.target.value)}
                                rows={1}
                                onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
                                ref={el=>{if(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}}}
                                className="w-full bg-amber-50/60 border border-amber-200/60 rounded-xl p-3 text-[13px] font-bold text-slate-700 outline-none focus:ring-2 focus:ring-amber-400 resize-none overflow-hidden" />
                        </div>
                    )}
                </section>
                {(() => {
                    const _ov = weightStepsOverrides ? weightStepsOverrides[ex.id] : undefined;
                    let _wv = null;
                    if (_ov === '4-5' || _ov === undefined) {
                        _wv = CUSTOM_WEIGHT_VALUES[ex.id] || null;
                        if (_ov === '4-5' && !_wv) _wv = THIGH_VALUES;
                    }
                    const _ws = _wv ? 1 : ((_ov !== undefined && _ov !== '4-5')
                        ? _ov
                        : (DEFAULT_WEIGHT_STEPS[ex.id] !== undefined ? DEFAULT_WEIGHT_STEPS[ex.id] : 1));
                    return (
                <ExerciseEntryRow ex={ex} logs={logs} sessionStartTime={sessionStartTime}
                    onSave={onSave} isLast={isLast} onFinish={onFinish} isSuperset={exIsSuperset}
                    onWarmupOpened={handleWarmupOpened}
                    restTimer={restTimers[ex.id]||0} restTimerTotal={restTimerTotals[ex.id]||0}
                    forceSet1Disabled={forceSet1Disabled} forceSet2Disabled={forceSet2Disabled}
                    prevRestTimer={fPrevRt} prevRestTimerTotal={fPrevTot}
                    accentColor={accentHex} requestConfirm={requestConfirm}
                    weightStep={_ws} weightValues={_wv}
                    weightJumpSteps={_wv ? [1,2,3] : [_ws, _ws*2, _ws*4]}
                    repsStep={1} repsJumpSteps={[1,2,3,5]} warmupEmbed={!!warmupEmbed[ex.id]}
                    historyOpen={!!historyOpen[ex.id]} onToggleHistory={()=>setHistoryOpen(p=>({...p,[ex.id]:!p[ex.id]}))} onDeleteLog={onDeleteLog}
                    warmupOpen={warmupOpenMap[ex.id] ?? !!warmupEmbed[ex.id]} onToggleWarmup={(v)=>setWarmupOpenMap(p=>({...p,[ex.id]:v}))} />
                    );
                })()}
            </div>
        );
    };

    return (

            g[d].push(l);

                                        {(()=>{

// ─── Backup helper ─────────────────────────────────────────
// גיבוי גורף — אוסף כל מפתח gym-* מ-localStorage כדי ששום נתון לא ייפול
const BACKUP_SKIP_KEYS = new Set(['gym-last-backup', 'gym-music-list']);
const collectAllGymData = () => {
    const all = {};
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('gym-') && !BACKUP_SKIP_KEYS.has(k)) {
                try { all[k] = JSON.parse(localStorage.getItem(k)); }
                catch { all[k] = localStorage.getItem(k); }
            }
        }
    } catch {}
    return all;
};
let _backupDirHandle = null;
const getBackupDirName = () => _backupDirHandle?.name || null;

const loadBackupDirHandle = async () => {
    try {
        const h = await IDB.get('backup-dir-handle');
        if (h) { _backupDirHandle = h; }
    } catch {}
};
const saveBackupDirHandle = async (h) => {
    _backupDirHandle = h;
    await IDB.set('backup-dir-handle', h);
};

const writeToDir = async (dirHandle, json, fname) => {
    const perm = await dirHandle.queryPermission({mode:'readwrite'});
    if (perm !== 'granted') {
        const req = await dirHandle.requestPermission({mode:'readwrite'});
        if (req !== 'granted') return false;
    }
    const fh = await dirHandle.getFileHandle(fname, {create:true});
    const writable = await fh.createWritable();
    await writable.write(json);
    await writable.close();
    return true;
};

// תמיד מוריד עותק מקומי; אם תיקיית גיבוי/FILING מחוברת, כותב לשם *בנוסף* (לא במקום)
const triggerBackupDownload = async (data, silent) => {
    const payload = { ...data, _all: collectAllGymData() };
    const json = JSON.stringify(payload, null, 2);
    const fname = `gym-backup-${new Date().toLocaleDateString('he-IL').replace(/\./g,'-')}.json`;
    let dirOk = false;
    if (_backupDirHandle) {
        try { dirOk = await writeToDir(_backupDirHandle, json, fname); } catch {}
    }
    if (!silent && !_backupDirHandle && window.showSaveFilePicker) {
        try {
            const opts = { suggestedName: fname, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] };
            const fh = await window.showSaveFilePicker(opts);
            const writable = await fh.createWritable();
            await writable.write(json);
            await writable.close();
            try { const parent = await fh.getParent?.(); if (parent) await saveBackupDirHandle(parent); } catch {}
            return true;
        } catch (e) { if (e.name === 'AbortError') return dirOk; }
    }
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.click();
    URL.revokeObjectURL(url);
    return true;
};

const triggerBackupRestore = async () => {
    if (window.showOpenFilePicker) {
        try {
            const opts = { types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }], multiple: false };
            if (_backupDirHandle) opts.startIn = _backupDirHandle;
            const [fh] = await window.showOpenFilePicker(opts);
            const file = await fh.getFile();
            try { _backupDirHandle = await fh.getParent?.(); } catch {}
            return file;
        } catch (e) { if (e.name === 'AbortError') return null; }
    }
    return null;
};

// ─── Sound helpers ─────────────────────────────────────────
let _muteTimeout = null;
const playCountdownBeep = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'sine';
        gain.gain.setValueAtTime(0.9, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.18);
    } catch(e) {}
};
const playWarningBeep = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.3].forEach(offset => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 520; osc.type = 'sine';
            gain.gain.setValueAtTime(0.9, ctx.currentTime + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.22);
            osc.start(ctx.currentTime + offset); osc.stop(ctx.currentTime + offset + 0.22);
        });
    } catch(e) {}
};
const playRestCompleteSound = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [500, 700, 950].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(1.0, ctx.currentTime + i * 0.22);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.22 + 0.25);
            osc.start(ctx.currentTime + i * 0.22); osc.stop(ctx.currentTime + i * 0.22 + 0.28);
        });
    } catch(e) {}
};
const playPhoneRingSound = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [[0, 0.5], [0.7, 1.2], [1.4, 1.9]].forEach(([s, e]) => {
            [440, 480].forEach(freq => {
