                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq; osc.type = 'sine';
                gain.gain.setValueAtTime(0, ctx.currentTime + s);
                gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + s + 0.02);
                gain.gain.setValueAtTime(0.4, ctx.currentTime + e - 0.02);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + e);
                osc.start(ctx.currentTime + s); osc.stop(ctx.currentTime + e);
            });
        });
    } catch(e) {}
};

// ─── WorkoutProgressCalendar ───────────────────────────────
const WorkoutProgressCalendar = ({ logs }) => {
    const [cur, setCur] = useState(() => { const d=new Date(); return {y:d.getFullYear(),m:d.getMonth()}; });
    const workoutDays = useMemo(() => {
        const s = new Set();
        logs.forEach(l => { const d=new Date(l.timestamp); if(d.getFullYear()===cur.y&&d.getMonth()===cur.m) s.add(d.getDate()); });
        return s;
    }, [logs, cur]);
    const avgPerWeek = useMemo(() => {
        const allDays = new Set(logs.map(l => { const d=new Date(l.timestamp); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }));
        if (allDays.size === 0) return '0';
        const ts = logs.map(l=>new Date(l.timestamp).getTime());
        const weeks = Math.max(1, (Date.now() - Math.min(...ts)) / (7*24*3600*1000));
        return (allDays.size / weeks).toFixed(1);
    }, [logs]);
    const daysInMonth = new Date(cur.y, cur.m+1, 0).getDate();
    const firstDay    = new Date(cur.y, cur.m, 1).getDay();
    const monthName   = new Date(cur.y, cur.m, 1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});
    const today       = new Date();
    const isCurMonth  = today.getFullYear()===cur.y && today.getMonth()===cur.m;
    const prev = () => setCur(p=>{ const d=new Date(p.y,p.m-1); return {y:d.getFullYear(),m:d.getMonth()}; });
    const next = () => setCur(p=>{ const d=new Date(p.y,p.m+1); return {y:d.getFullYear(),m:d.getMonth()}; });
    return (
        <div className="px-5 pb-5">
            <div className="flex items-center justify-between mb-3" dir="ltr">
                <button onClick={prev} className="p-2 bg-slate-100 rounded-xl active:scale-95 active:bg-slate-200">
                    <Icon name="ChevronLeft" size={16} className="text-slate-600" />
                </button>
                <div className="text-center">
                    <div className="font-black text-slate-800 text-sm">{monthName}</div>
                    <div className="text-[11px] font-bold text-emerald-600">{workoutDays.size} אימונים · ממוצע {avgPerWeek}/שבוע</div>
                </div>
                <button onClick={next} disabled={isCurMonth}
                    className={`p-2 rounded-xl active:scale-95 active:bg-slate-200 ${isCurMonth?'opacity-25':'bg-slate-100'}`}>
                    <Icon name="ChevronLeft" size={16} className="text-slate-600 rotate-180" />
                </button>
            </div>
            <div className="grid grid-cols-7 mb-1" dir="ltr">
                {['א','ב','ג','ד','ה','ו','ש'].map(d=>(
                    <div key={d} className="text-center text-[10px] font-black text-slate-400">{d}</div>
                ))}
            </div>
            <div className="grid grid-cols-7 gap-1" dir="ltr">
                {Array.from({length:firstDay}).map((_,i)=><div key={`e${i}`}/>)}
                {Array.from({length:daysInMonth}).map((_,i)=>{
                    const day=i+1;
                    const isTrain=workoutDays.has(day);
                    const isToday=isCurMonth&&today.getDate()===day;
                    return (
                        <div key={day} className={`aspect-square rounded-xl flex items-center justify-center text-[12px] font-black
                            ${isTrain?'bg-emerald-500 text-white shadow-sm':isToday?'bg-blue-100 text-blue-700':'bg-slate-50 text-slate-400'}`}>
                            {day}
                        </div>
                    );
                })}
            </div>
        </div>
    );
};

                    {open.reports && <div className="px-5 pb-5 space-y-3">
                        {(()=>{
                            const generateReport = (period) => {
                                const now = new Date();
                                let fromDate;
                                let periodLabel;
                                if (period === 'day') { fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); periodLabel = `יומי — ${now.toLocaleDateString('he-IL')}`; }
                                else if (period === 'week') { fromDate = new Date(now.getTime() - 7*86400000); periodLabel = `שבועי — ${fromDate.toLocaleDateString('he-IL')} עד ${now.toLocaleDateString('he-IL')}`; }
                                else if (period === 'month') { fromDate = new Date(now.getFullYear(), now.getMonth()-1, now.getDate()); periodLabel = `חודשי — ${fromDate.toLocaleDateString('he-IL')} עד ${now.toLocaleDateString('he-IL')}`; }
                                else { fromDate = new Date(0); periodLabel = 'כולל — כל הזמנים'; }
                                const filtered = logs.filter(l => new Date(l.timestamp) >= fromDate).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
                                if (!filtered.length) { showToast('אין נתונים לתקופה זו', true); return; }
                                const grouped = {};
                                filtered.forEach(l => {
                                    const d = new Date(l.timestamp).toLocaleDateString('he-IL');
                                    if (!grouped[d]) grouped[d] = [];
                                    grouped[d].push(l);
                                });
                                const planStart = new Date(sessionStartTime).toLocaleDateString('he-IL');
                                const planEnd = sessionEndTime ? new Date(sessionEndTime).toLocaleDateString('he-IL') : 'לא נקבע';
                                const totalDays = Object.keys(grouped).length;
                                const totalSets = filtered.length;
                                const visibleCount = exerciseGroups.filter(g=>!hiddenExercises.has(g.id)).length;
                                const totalExercises = new Set(filtered.map(l=>l.exId)).size;
                                const totalDurSec = Object.entries(sessionDurations||{}).filter(([ts])=>{
                                    const d = new Date(Number(ts));
                                    return d >= fromDate && d <= now;
                                }).reduce((s,[,v])=>s+v, 0);
                                const avgDurMin = totalDays > 0 ? Math.round(totalDurSec / totalDays / 60) : 0;
                                const daysInPeriod = Math.max(1, Math.ceil((now - fromDate) / 86400000));
                                const freqPerWeek = totalDays > 0 ? (totalDays / daysInPeriod * 7).toFixed(1) : '0';

                                let txt = `דוח אימונים — ${periodLabel}\n`;
                                txt += `${'═'.repeat(40)}\n\n`;
                                txt += `תקופת תוכנית: ${planStart} — ${planEnd}\n`;

// ─── FloatingRestTimer ─────────────────────────────────────
const FloatingRestTimer = memo(({ restTimers, restTimerTotals, logs, visibleGroups, activeGroup }) => {
    const active = useMemo(() => {
        let best = null;
        for (const id in restTimers) {
            const rt = restTimers[id] || 0;
            const tot = restTimerTotals[id] || 0;
            if (rt > 0 && tot > 0 && (!best || rt < best.rt)) best = { id, rt, tot };
        }
        return best;
    }, [restTimers, restTimerTotals]);
    const nextInfo = useMemo(() => {
        if (!active || !visibleGroups || !logs) return null;
        const curGroup = activeGroup || visibleGroups.find(g => g.exercises.some(e => e.id === active.id));
        if (!curGroup) return null;
        let nextEx = null;
        if (curGroup.exercises.length === 2) {
            nextEx = curGroup.exercises.find(e => e.id !== active.id) || curGroup.exercises[0];
        } else {
            nextEx = curGroup.exercises[0];
        }
        if (!nextEx) return null;
        const isGrav = GRAVITRON_EXERCISES.has(nextEx.id);
        const exLogs = logs.filter(l => l.exId === nextEx.id && l.setNum > 0 && l.weight > 0)
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        const bestLog = exLogs.length > 0
            ? exLogs.reduce((best, l) => isGrav ? (l.weight < best.weight ? l : best) : (l.weight > best.weight ? l : best), exLogs[0])
            : null;
        const warmupLogs = logs.filter(l => l.exId === nextEx.id && l.setNum === 0 && l.weight > 0)
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        return { weight: bestLog?.weight || 0, warmupWeight: warmupLogs[0]?.weight || 0 };
    }, [active, visibleGroups, activeGroup, logs]);
    if (!active) return null;
    const pct = (active.rt / active.tot) * 100;
    return (
        <div className="fixed left-0 right-0 z-[700] pointer-events-none"
             style={{top:'env(safe-area-inset-top)'}}>
            <div className="h-3 bg-slate-200/50 overflow-hidden">
                <div className="h-full bg-orange-500 transition-all duration-1000 ease-linear" style={{width: pct + '%'}} />
            </div>
        </div>
    );
});

            if (!cats[g.category]) cats[g.category] = [];
            cats[g.category].push(g);
        });

    return (

                                const ex = g.exercises[0];
                                const img = images?.[ex.id] || (EXERCISE_IMAGES[ex.id] ? `images/${EXERCISE_IMAGES[ex.id]}` : null);
                                const lastLog = [...logs].filter(l => l.exId === ex.id)

                                        </div>

                                            <span className="text-xl font-black text-orange-500 shrink-0 px-1">{lastLog.weight}<span className="text-[10px] font-bold mr-0.5">kg</span></span>

                                    </div>
                                );
                            })}

                    </div>
                ))}
            </div>
        </div>
    );
};

    const [workoutSec,       setWorkoutSec]       = useState(()=>{

    // אם האימון נשאר "פעיל" ב-localStorage אבל עברו שעות רבות — כנראה הדף נסגר/נשכח, לא ממשיכים לספור אוטומטית
    useEffect(() => {
        const wasActive = LS.get('gym-workout-active', false);

    }, []);
    const [restTimers,       setRestTimers]       = useState({});

    const [hiddenExercises,  setHiddenExercises]  = useState(()=>new Set(LS.get('gym-hidden-exercises',[])));
    const [groupOrder,       setGroupOrder]       = useState(()=>{

    });
    const [sessionStartTime, setSessionStartTime] = useState(()=>{
        if (!LS.get('gym-migrated-start-v1', false)) {

            LS.set('gym-session-start', t);
            LS.set('gym-migrated-start-v1', true);
            return t;
        }
        return LS.get('gym-session-start', new Date('2026-04-27').getTime());
    });
    const [workoutStartTime, setWorkoutStartTime] = useState(()=>LS.get('gym-workout-start', Date.now()));
    const [sessionEndTime,   setSessionEndTime]   = useState(()=>LS.get('gym-session-end', null));
    const [editingDates,     setEditingDates]     = useState(null);
    const [scrollToExId,     setScrollToExId]     = useState(null);
    const [confirmAction,    setConfirmAction]    = useState(null);
    const [showNewWorkoutModal, setShowNewWorkoutModal] = useState(false);
    const [skippedGroups,    setSkippedGroups]    = useState([]);
    const [showSummary,      setShowSummary]      = useState(false);
    const [summaryData,      setSummaryData]      = useState(()=>LS.get('gym-last-summary', null));
    useEffect(()=>{ LS.set('gym-last-summary', summaryData); },[summaryData]);
    const [isWorkoutComplete,setIsWorkoutComplete]= useState(false);
    const [toast,            setToast]            = useState(null);
    const [workoutDecisionMade, setWorkoutDecisionMade] = useState(false);
    const [autoTransitionSplash, setAutoTransitionSplash] = useState(null);
    const [splashAnchorTop, setSplashAnchorTop] = useState(null);
    // ממקם את הפופ-אפ המשקל בדיוק מעל אזור הסטים של התרגיל הבא (לא במרחק קבוע מתחתית המסך שמשתנה בין עמודים)

    }, [autoTransitionSplash]);
    const [summaryNote,      setSummaryNote]      = useState('');
    const [summaryBW,        setSummaryBW]        = useState('');
    const [summarySaved,     setSummarySaved]     = useState(false);
    const [summaryBackedUp,  setSummaryBackedUp]  = useState(false);
    const [showBwStats,      setShowBwStats]      = useState(false);
    const [editingDur,       setEditingDur]       = useState(false);
    const [bodyweightLog,    setBodyweightLog]    = useState(()=>LS.get('gym-bodyweight-log', []));
    useEffect(()=>{ LS.set('gym-bodyweight-log', bodyweightLog); },[bodyweightLog]);
    const [workoutNotes,     setWorkoutNotes]     = useState(()=>LS.get('gym-workout-notes', {}));
    useEffect(()=>{ LS.set('gym-workout-notes', workoutNotes); },[workoutNotes]);
    const [audioCurrentTime, setAudioCurrentTime] = useState(0);
    const [audioDuration,    setAudioDuration]    = useState(0);
    const [notes,            setNotes]            = useState(()=>LS.get('gym-notes',{}));
    const [devNotes,         setDevNotes]         = useState(()=>LS.get('gym-dev-notes',{}));
    const [devNotesDone,     setDevNotesDone]     = useState(()=>LS.get('gym-dev-notes-done',{}));
    // ─── תיקיית FILING (File System Access API) — ברמת האפליקציה כדי לאפשר סנכרון אוטומטי של הערות ───
    const [filingDirName, setFilingDirName] = useState(null);
    const filingDirRef = React.useRef(null);
    const filingSupported = typeof window !== 'undefined' && 'showDirectoryPicker' in window;
    useEffect(() => {
        if (!filingSupported) return;
        (async () => {
            const handle = await IDB.get('filingDirHandle');
            if (!handle) return;
            try {
                const perm = await handle.queryPermission({ mode: 'readwrite' });
                if (perm === 'granted') { filingDirRef.current = handle; setFilingDirName(handle.name); }
            } catch {}
        })();
    }, [filingSupported]);
    const connectFilingDir = async () => {
        try {
            const handle = await window.showDirectoryPicker();
            const perm = await handle.requestPermission({ mode: 'readwrite' });
            if (perm !== 'granted') { showToast('לא ניתנה הרשאת כתיבה', true); return; }
            await IDB.set('filingDirHandle', handle);
            filingDirRef.current = handle; setFilingDirName(handle.name);
            await saveBackupDirHandle(handle); // אותה תיקייה משמשת גם לגיבויי JSON וגם לדוחות/הערות
            showToast(`תיקיית "${handle.name}" חוברה — משמשת גם לדוחות וגם לגיבויים`);
        } catch { /* בוטל ע"י המשתמש */ }
    };
    const disconnectFilingDir = async () => {
        await IDB.del('filingDirHandle');
        filingDirRef.current = null; setFilingDirName(null);
        showToast('החיבור לתיקייה נותק');
    };
    // שומר קובץ טקסט לתיקיית FILING אם מחוברת, אחרת מוריד כרגיל
    // תמיד שומר גם קובץ מקומי (הורדה רגילה) וגם, אם תיקיית FILING מחוברת, כותב לשם במקביל.
    // מחזיר true אם הכתיבה ל-FILING הצליחה (למטרות הודעת סטטוס בלבד).
    const saveTextFile = async (fname, txt) => {
        let filingOk = false;
        if (filingDirRef.current) {
            try {
                let perm = await filingDirRef.current.queryPermission({ mode: 'readwrite' });
                if (perm !== 'granted') perm = await filingDirRef.current.requestPermission({ mode: 'readwrite' });
                if (perm === 'granted') {
                    const fh = await filingDirRef.current.getFileHandle(fname, { create: true });
                    const w = await fh.createWritable();
                    await w.write(new Blob(['﻿'+txt], {type:'text/plain;charset=utf-8'}));
                    await w.close();
                    filingOk = true;
                }
            } catch {}
        }
        const blob = new Blob(['﻿'+txt], {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fname; a.click();
        URL.revokeObjectURL(url);
        return filingOk;
    };
    // כתיבה שקטה ל-FILING בלבד (ללא הורדה מקומית) — לשימוש בסנכרון אוטומטי ברקע, לא בפעולה יזומה של המשתמש
    const syncTextFileToFilingOnly = async (fname, txt) => {
        if (!filingDirRef.current) return false;
        try {
            let perm = await filingDirRef.current.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') perm = await filingDirRef.current.requestPermission({ mode: 'readwrite' });
            if (perm !== 'granted') return false;
            const fh = await filingDirRef.current.getFileHandle(fname, { create: true });
            const w = await fh.createWritable();
            await w.write(new Blob(['﻿'+txt], {type:'text/plain;charset=utf-8'}));
            await w.close();
            return true;
        } catch { return false; }
    };
    // כתיבה אוטומטית של קובץ הערות-שיפור עדכני (שם קבוע) בכל שינוי — בלי צורך בייצוא ידני
    const nameOfNoteKey = (exId) => {
        if (PAGE_NOTE_LABELS[exId]) return PAGE_NOTE_LABELS[exId];
        const ex = exerciseGroups.flatMap(g=>g.exercises).find(e=>e.id===exId);
        return customNames[exId] || ex?.title || exId;
    };
    const syncDevNotesFile = useCallback((notesObj, doneObj) => {
        if (!filingDirRef.current) return;
        const pending = Object.entries(notesObj||{}).filter(([k,t])=>t && t.trim() && !doneObj?.[k]);
        const txt = pending.length
            ? pending.map(([exId,t])=>`• ${nameOfNoteKey(exId)}:\n${t}`).join('\n\n')
            : '(אין הערות חדשות)';
        syncTextFileToFilingOnly('gym-dev-notes-current.txt', txt);
    }, [customNames]);
    const [images,           setImages]           = useState(()=>LS.get('gym-images',{}));
    const [videos,           setVideos]           = useState(()=>LS.get('gym-videos',{}));
    const [customNames,      setCustomNames]      = useState(()=>LS.get('gym-custom-names',{}));
    const [customHowTo,      setCustomHowTo]      = useState(()=>LS.get('gym-custom-howto',{}));
    const [customTips,       setCustomTips]       = useState(()=>LS.get('gym-custom-tips',{}));
    const [settings,         setSettings]         = useState(()=>LS.get('gym-settings',{normalRest:90,exerciseRest:70,supersetRest:60,warmupRest:60,weightSteps:{}}));
    const [sessionDurations, setSessionDurations] = useState(()=>LS.get('gym-session-durations',{}));
    const [instructors,      setInstructors]      = useState(()=>LS.get('gym-instructors', []));
    useEffect(()=>{ LS.set('gym-instructors', instructors); },[instructors]);

    // מוזיקה — playlist מרובה
    const [musicList,      setMusicList]      = useState([]); // [{id,name,url}] runtime
    const [musicIndex,     setMusicIndex]     = useState(0);
    const [musicPanelOpen, setMusicPanelOpen] = useState(false);
    const [musicPlaying,   setMusicPlaying]   = useState(false);
    const musicPanelTimerRef = React.useRef(null);
    const resetMusicPanelTimer = useCallback(() => {
        clearTimeout(musicPanelTimerRef.current);
        musicPanelTimerRef.current = setTimeout(()=>setMusicPanelOpen(false), 10000);
    }, []);
    useEffect(()=>{
        if (musicPanelOpen) resetMusicPanelTimer();
        else clearTimeout(musicPanelTimerRef.current);
        return ()=>clearTimeout(musicPanelTimerRef.current);
    },[musicPanelOpen]);
    const audioRef        = React.useRef(null);
    const musicPlayingRef = React.useRef(false);
    const musicListRef    = React.useRef([]);
    useEffect(()=>{ musicPlayingRef.current = musicPlaying; },[musicPlaying]);
    useEffect(()=>{ musicListRef.current = musicList; },[musicList]);

    // טעינת playlist מ-IDB בעת אתחול
    useEffect(()=>{
        const meta = LS.get('gym-music-list', []);
        if (!meta.length) return;
        Promise.all(meta.map(({id,name,type}) =>
            IDB.get(`music-${id}`).then(blob => {
                if (!blob) return null;
                const mimeType = type || blob.type || 'audio/mpeg';
                const typed = blob.type ? blob : new Blob([blob], {type: mimeType});
                return {id, name, url: URL.createObjectURL(typed)};
            })
        )).then(results => {
            const valid = results.filter(Boolean);
            setMusicList(valid);
            if (valid.length !== meta.length)
                LS.set('gym-music-list', valid.map(({id,name,type})=>({id,name,type})));
        });
    },[]);

    const handleMusicUpload = (files) => {
        if (!files?.length) return;
        // יצירת blob URLs סינכרונית — בתוך ה-user gesture
        const getAudioMime = f => {
            const n = f.name.toLowerCase();
            if (n.endsWith('.m4a')||n.endsWith('.m4b')||n.endsWith('.aac')) return 'audio/mp4';
            if (n.endsWith('.mp3')) return 'audio/mpeg';
            if (n.endsWith('.ogg')) return 'audio/ogg';
            if (n.endsWith('.wav')) return 'audio/wav';
            if (n.endsWith('.flac')) return 'audio/flac';
            if (n.endsWith('.webm')) return 'audio/webm';
            return f.type || 'audio/mpeg';
        };
        const newItems = Array.from(files).map(file => {
            const mimeType = getAudioMime(file);
            const blob = (mimeType !== file.type) ? new Blob([file], {type: mimeType}) : file;
            return {
                id: `${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
                name: file.name,
                type: mimeType,
                url: URL.createObjectURL(blob),
                _file: blob
            };
        });
        const startIdx = musicListRef.current.length;
        setMusicIndex(startIdx);
        setMusicList(prev => {
            const next = [...prev, ...newItems.map(({id,name,type,url})=>({id,name,type,url}))];
            LS.set('gym-music-list', next.map(({id,name,type})=>({id,name,type})));
            return next;
        });
        // שמירה ל-IDB ברקע (לא חוסם gesture)
        newItems.forEach(({id, _file}) => IDB.set(`music-${id}`, _file));
        showToast(`${newItems.length} קבצים נשמרו`);
        // בדיקת תמיכה: ניסיון פענוח לאחר שמירה — רק אזהרה, לא מבטל
        newItems.forEach(({name, url, type}) => {
            if (!type.includes('mp4') && !type.includes('mpeg') && !type.includes('ogg') && !type.includes('wav')) return;
            const tst = document.createElement('audio');
            const can = tst.canPlayType(type);
            if (can === '') {
                setTimeout(()=>showToast(`⚠️ ${name.slice(0,20)}... ייתכן שלא יופעל`, true), 1500);
            }
        });
    };
    const handleMusicRemoveOne = async (id) => {
        await IDB.del(`music-${id}`);
        setMusicList(prev => {
            const next = prev.filter(t=>t.id!==id);
            LS.set('gym-music-list', next.map(({id,name,type})=>({id,name,type})));
            return next;
        });
        setMusicIndex(i => 0);
    };
    const handleMusicRemoveAll = async () => {
        const meta = LS.get('gym-music-list', []);

    const requestConfirm = useCallback((text,onConfirm,onCancel)=>setConfirmAction({text,onConfirm,onCancel}),[]);
    const showToast      = useCallback((msg,isError=false)=>{ setToast({msg,isError}); setTimeout(()=>setToast(null),2500); },[]);

    // אזהרה לפני יציאה/רענון בטעות באמצע אימון פעיל
    useEffect(() => {
        if (!isWorkoutActive) return;
        const handler = (e) => { e.preventDefault(); e.returnValue = ''; return ''; };
        window.addEventListener('beforeunload', handler);
        return () => window.removeEventListener('beforeunload', handler);

    // שמירה אוטומטית ב-localStorage
    useEffect(()=>{ LS.set('gym-logs',           logs);             },[logs]);
    useEffect(()=>{ LS.set('gym-notes',          notes);            },[notes]);
    useEffect(()=>{ LS.set('gym-dev-notes',      devNotes);         },[devNotes]);
    useEffect(()=>{ LS.set('gym-dev-notes-done', devNotesDone);     },[devNotesDone]);
    // סנכרון אוטומטי לקובץ ב-FILING בכל שינוי בהערות (הוספה/עריכה/סימון כבוצע/מחיקה) — ללא צורך בייצוא ידני
    useEffect(()=>{ syncDevNotesFile(devNotes, devNotesDone); },[devNotes, devNotesDone, filingDirName]);

    useEffect(()=>{ LS.set('gym-videos',         videos);           },[videos]);
    useEffect(()=>{ LS.set('gym-custom-names',  customNames);      },[customNames]);
    useEffect(()=>{ LS.set('gym-custom-howto', customHowTo);      },[customHowTo]);
    useEffect(()=>{ LS.set('gym-custom-tips',  customTips);       },[customTips]);
    useEffect(()=>{ LS.set('gym-settings',       settings);         },[settings]);
    useEffect(()=>{ LS.set('gym-group-order',    groupOrder);       },[groupOrder]);
    useEffect(()=>{ LS.set('gym-hidden-exercises',[...hiddenExercises]); },[hiddenExercises]);
    useEffect(()=>{ LS.set('gym-session-start',   sessionStartTime);  },[sessionStartTime]);
    useEffect(()=>{ LS.set('gym-workout-start',   workoutStartTime);  },[workoutStartTime]);
    useEffect(()=>{ LS.set('gym-workout-active',  isWorkoutActive);   },[isWorkoutActive]);
    useEffect(()=>{ LS.set('gym-session-end',       sessionEndTime);    },[sessionEndTime]);
    useEffect(()=>{ LS.set('gym-session-durations', sessionDurations);  },[sessionDurations]);
    // שמירה רציפה של זמן האימון — מבטיח שגם בכניסה/יציאה לא תיאבד מדידה
    useEffect(()=>{

        LS.set('gym-last-workout-sec', workoutSec);
        if (workoutStartTime) {
            setSessionDurations(prev => ({...prev, [workoutStartTime]: workoutSec}));
        }
    },[workoutSec, workoutStartTime]);

    // טעינת ספריית גיבוי שמורה + גיבוי אוטומטי בשעה 20:00
    useEffect(()=>{
        loadBackupDirHandle();
        const doAutoBackup = () => {
            const now = new Date();
            const today = now.toDateString();
            const lastDate = LS.get('gym-last-backup-date', '');
            if (lastDate === today) return;
            if (now.getHours() < 20) return;
            if (!_backupDirHandle) return;
            const data = {
                logs:          LS.get('gym-logs',           []),
                notes:         LS.get('gym-notes',          {}),
                images:        LS.get('gym-images',         {}),
                videos:        LS.get('gym-videos',         {}),
                settings:      LS.get('gym-settings',       {normalRest:90,exerciseRest:70,supersetRest:60,warmupRest:60}),
                sessionStart:  LS.get('gym-session-start',  null),
                sessionEnd:    LS.get('gym-session-end',    null),
                groupOrder:    LS.get('gym-group-order',    null),
                lastWorkoutSec:  LS.get('gym-last-workout-sec',  0),
                showDetails:     LS.get('gym-show-details',     {}),
                sessionDurations:LS.get('gym-session-durations', {}),
                workoutNotes:    LS.get('gym-workout-notes',    {}),
                instructors:     LS.get('gym-instructors',      []),
                hiddenExercises: LS.get('gym-hidden-exercises', []),
                bodyweightLog:   LS.get('gym-bodyweight-log',   []),
                lastSummary:     LS.get('gym-last-summary',     null),
                customNames:     LS.get('gym-custom-names',     {}),
                customHowTo:     LS.get('gym-custom-howto',     {})
            };
            triggerBackupDownload(data, true);
            LS.set('gym-last-backup-date', today);
        };
        doAutoBackup();
        const interval = setInterval(doAutoBackup, 60000);
        return ()=>clearInterval(interval);
    },[]);

    // מיגרציה: הרמות רגליים (ex10b) עברו מטיימר לחזרות — ערכי "שניות" ישנים (≥40) הם בעצם 21 חזרות
    useEffect(()=>{
        if (LS.get('gym-migrated-ex10b-reps', false)) return;
        setLogs(prev=>{
            let changed=false;
            const next=prev.map(l=>{ if(l.exId==='ex10b' && l.reps>=40){ changed=true; return {...l, reps:21}; } return l; });
            return changed?next:prev;
        });
        LS.set('gym-migrated-ex10b-reps', true);
    },[]);

    // חסימת כפתור חזרה של הטלפון במסך תרגיל
    useEffect(()=>{
        if (view!=='detail') return;
        history.pushState(null,'');
        const handler = ()=>{
            if (_videoModalOpen) return;
            setView('list'); setActiveGroup(null);
        };
        window.addEventListener('popstate', handler);
        return ()=>window.removeEventListener('popstate', handler);
    },[view]);

    // Timers — כל תקופת פעילות מחושבת מזמן שעון אמיתי (Date.now) ולא מספירת טיקים,
    // כדי שלא "יתקע" כשהמסך ננעל/הדפדפן ברקע (מסתנכרן מיד עם visibilitychange).
    // בפאוז (isWorkoutActive=false) ה-effect מתנקה והשנייה האחרונה נשארת קפואה.
    useEffect(()=>{
        if (!isWorkoutActive) return;
        const periodStart = Date.now();
        const secBefore   = workoutSec;
        const tick = () => {
            const elapsed = Math.floor((Date.now() - periodStart)/1000);
            setWorkoutSec(secBefore + elapsed);
        };
        tick();
        const t = setInterval(tick, 1000);
        document.addEventListener('visibilitychange', tick);
        return ()=>{ clearInterval(t); document.removeEventListener('visibilitychange', tick); };
        // eslint-disable-next-line react-hooks/exhaustive-deps
    },[isWorkoutActive]);

    // ref לגישה מה-interval ללא closure ישן
    const restTimersRef = React.useRef({});
    useEffect(()=>{ restTimersRef.current = restTimers; },[restTimers]);
    const logsRef = React.useRef(logs);
    useEffect(()=>{ logsRef.current = logs; },[logs]);
    const sstRef = React.useRef(workoutStartTime);
    useEffect(()=>{ sstRef.current = workoutStartTime; },[workoutStartTime]);
    const skippedRef = React.useRef(skippedGroups);
    useEffect(()=>{ skippedRef.current = skippedGroups; },[skippedGroups]);
    const visibleGroupsRef = React.useRef([]);
    useEffect(()=>{ visibleGroupsRef.current = visibleGroups; },[visibleGroups]);
    const activeGroupRef = React.useRef(null);
    useEffect(()=>{ activeGroupRef.current = activeGroup; },[activeGroup]);

    useEffect(()=>{
        const t = setInterval(()=>{
            const cur = restTimersRef.current;
            if (Object.keys(cur).length === 0) return;
            const next = {};
            let doCountdown = false, doWarning = false, completedExId = null;
            Object.entries(cur).forEach(([k,v])=>{
                if (v > 1) {
                    next[k] = v - 1;
                    if (v <= 3) doCountdown = true;
                    if (v === 21) doWarning = true;
                } else if (v === 1) {
                    completedExId = k;
                }
            });
            // הנמך מוזיקה זמנית לפני צפצוף
            if ((doCountdown || doWarning || completedExId) && musicPlayingRef.current && audioRef.current) {
                audioRef.current.volume = 0.07;
                clearTimeout(_muteTimeout);
                _muteTimeout = setTimeout(() => { if (audioRef.current) audioRef.current.volume = 1; }, 2400);
            }
            if (doCountdown) {
                playCountdownBeep();
                const spokenSec = Object.values(next).find(v => v >= 1 && v <= 3);
                if (spokenSec && window.speechSynthesis) {
                    const u = new SpeechSynthesisUtterance(String(spokenSec));
                    u.lang = 'he-IL'; u.rate = 1.2; u.volume = 0.8;
                    window.speechSynthesis.speak(u);
                }
            }
            if (doWarning) {
                playWarningBeep();
                if (window.speechSynthesis) {
                    const u = new SpeechSynthesisUtterance('עשרים');
                    u.lang = 'he-IL'; u.rate = 1.2; u.volume = 1.0;
                    window.speechSynthesis.speak(u);
                }
            }
            if (completedExId) {
                playPhoneRingSound();
                // TTS — הכרז משקל התרגיל הבא
                if (window.speechSynthesis) {
                    const curLogsT = logsRef.current;
                    const curVisT = visibleGroupsRef.current;
                    const curActiveT = activeGroupRef.current;
                    const curGroupT = curActiveT || curVisT.find(g => g.exercises.some(e => e.id === completedExId));
                    if (curGroupT) {
                        let nextExT = null;
                        if (curGroupT.exercises.length === 2) {
                            nextExT = curGroupT.exercises.find(e => e.id !== completedExId) || curGroupT.exercises[0];
                        } else {
                            nextExT = curGroupT.exercises[0];
                        }
                        if (nextExT) {
                            const curSstT = sstRef.current;
                            const doneS1T = curLogsT.some(l => l.exId===nextExT.id && l.setNum===1 && new Date(l.timestamp).getTime()>curSstT);
                            const doneS2T = curLogsT.some(l => l.exId===nextExT.id && l.setNum===2 && new Date(l.timestamp).getTime()>curSstT);
                            const nextW = getNextSetWeight(nextExT.id, curLogsT, doneS1T, doneS2T);
                            if (nextW > 0) {
                                setTimeout(() => {
                                    const u = new SpeechSynthesisUtterance(String(nextW));
                                    u.lang = 'he-IL'; u.rate = 1.0; u.volume = 1.0;
                                    window.speechSynthesis.speak(u);
                                }, 1200);
                            }
                        }
                    }
                }
                const curLogs = logsRef.current;
                const curSst  = sstRef.current;
                const curSkip = skippedRef.current;
                const curVis  = visibleGroupsRef.current;
                const targetGroup = curVis.find(g => g.exercises.some(e => e.id === completedExId));
                const curActive   = activeGroupRef.current;
                // קפיצה אוטומטית מתבצעת רק אם המשתמש עדיין נמצא בקבוצה שבה הסט הסתיים
                // (אם עבר ידנית לתרגיל אחר - לא קופצים)
                const userStillOnTarget = !!(targetGroup && curActive && curActive.id === targetGroup.id);
                if (targetGroup && userStillOnTarget) {
                    const isDoneEx = ex => {
                        const sl = curLogs.filter(l => l.exId === ex.id && new Date(l.timestamp).getTime() > curSst);
                        return sl.some(l=>l.setNum===1) && sl.some(l=>l.setNum===2);
                    };
                    const groupDone = targetGroup.exercises.every(isDoneEx);
                    // קופצים לתרגיל הבא רק אם הקבוצה כולה הסתיימה (הסט האחרון)
                    if (groupDone) {
                        const nextGroup = curVis.find(g => {
                            if (curSkip.includes(g.id)) return false;
                            return !g.exercises.every(isDoneEx);
                        });
                        if (nextGroup) {
                            setActiveGroup(nextGroup); setView('detail');
                            setScrollToExId(nextGroup.exercises[0].id);
                        }
                    }
                    // אחרת — לא מזיזים את המשתמש (גם לא בתוך הקבוצה)
                }
            }
            setRestTimers(next);
        },1000);
        return ()=>clearInterval(t);
    },[]);

    const handleUpdateSettings = (key,value) => {
        const newSettings = key==='_bulk' ? value : {...settings,[key]:value};
        setSettings(newSettings);
    };

    const playSetCompleteSound = () => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            const notes = [800, 600, 800];
            const duration = 0.1;
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, now + i*duration);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i*duration + duration*0.8);
                osc.start(now + i*duration);
                osc.stop(now + i*duration + duration);
            });
        } catch (e) {}
    };

    const handleSaveSet = (exId,setNum,weight,reps,isSuperset) => {
        setAutoTransitionSplash(null); // סגירת הופ-אפ המשקל האוטומטי (אם פתוח) בלחיצה על סיום/עדכן של כל סט
        const newLog = {id:crypto.randomUUID(), exId, setNum, weight, reps, timestamp:new Date().toISOString()};
        const wst = sstRef.current;
        const isReplace = logsRef.current.some(l=>l.exId===exId&&l.setNum===setNum&&new Date(l.timestamp).getTime()>wst);
        if (isReplace) {
            setLogs(prev=>[...prev.filter(l=>!(l.exId===exId&&l.setNum===setNum&&new Date(l.timestamp).getTime()>wst)), newLog]);
            return;
        }
        setLogs(prev=>[...prev, newLog]);
        const dur = isSuperset ? (settings.supersetRest||60)
            : setNum === 0 ? (settings.warmupRest||60)
            : setNum === 2 ? (settings.exerciseRest||120)
            : (settings.normalRest||90);
        setRestTimers({[exId]: dur});
        setRestTimerTotals(prev => ({...prev, [exId]: dur}));
        // סופרסט: קפיצה מיידית לתרגיל הבא בסדר A1→B1→A2→B2
        if (isSuperset) {
            const sg = exerciseGroups.find(g=>g.exercises.some(e=>e.id===exId));
            if (sg && sg.isSuperset && sg.exercises.length===2) {
                const [ta,tb] = sg.exercises;
                const wst = sstRef.current;
                const allLogs = [...logsRef.current, newLog];
                const dA1 = allLogs.some(l=>l.exId===ta.id&&l.setNum===1&&new Date(l.timestamp).getTime()>wst);
                const dB1 = allLogs.some(l=>l.exId===tb.id&&l.setNum===1&&new Date(l.timestamp).getTime()>wst);
                const dA2 = allLogs.some(l=>l.exId===ta.id&&l.setNum===2&&new Date(l.timestamp).getTime()>wst);
                const dB2 = allLogs.some(l=>l.exId===tb.id&&l.setNum===2&&new Date(l.timestamp).getTime()>wst);
                const nextId = !dA1 ? ta.id : !dB1 ? tb.id : !dA2 ? ta.id : !dB2 ? tb.id : null;
                if (nextId && nextId !== exId) setTimeout(()=>setScrollToExId(nextId), 50);
            }
        }
    };

    const handleSaveNote = (exId,text) => {
        setNotes(prev=>({...prev,[exId]:text}));
    };

    const handleSaveDevNote = (exId,text) => {
        setDevNotes(prev=>{
            const next = {...prev};
            if (text) next[exId] = text; else delete next[exId];
            return next;
        });
    };

    const handleSaveVideo = (exId, url) => {
        if (!url.trim()) return;
        const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
        const videoId = match ? match[1] : null;
        if (!videoId) { showToast('קישור YouTube לא תקין', true); return; }
        setVideos(prev=>({...prev,[exId]:videoId}));
        showToast('הסרטון נשמר');
    };

    const handleDeleteVideo = (exId) => {
        setVideos(prev=>{ const n={...prev}; delete n[exId]; return n; });
        showToast('הסרטון הוסר');
    };

    const handleRemoveImage = (exId) => {
        setImages(prev=>{ const n={...prev}; delete n[exId]; return n; });
        showToast('התמונה הוסרה');
    };

    const handleSaveImage = (exId, file) => {
        if (!file) return;
        showToast('טוען תמונה...');
        const canvas = document.createElement('canvas');
        const ctx    = canvas.getContext('2d');
        const img    = new Image();
        const reader = new FileReader();
        reader.onload = ev => {
            img.onload = () => {
                const MAX = 800;
                const ratio = Math.min(MAX/img.width, MAX/img.height, 1);
                canvas.width  = Math.round(img.width  * ratio);
                canvas.height = Math.round(img.height * ratio);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const url = canvas.toDataURL('image/jpeg', 0.8);
                setImages(prev=>({...prev,[exId]:url}));
                showToast('התמונה נשמרה');
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    const startNewWorkout = ()=>{
        const wst = Date.now();
        setWorkoutSec(0); setIsWorkoutActive(false); setRestTimers({}); setRestTimerTotals({});
        setSkippedGroups([]); setShowSummary(false); setIsWorkoutComplete(false);
        setWorkoutDecisionMade(false); setSummaryNote(''); setSummaryBW(''); setSummarySaved(false); setSummaryBackedUp(false);
        setWorkoutStartTime(wst); setView('list'); setActiveGroup(null);
        LS.set('gym-last-workout-sec', 0); // איפוס טיימר כללי
    };

    const handleDeleteLog  = id=>{
        setLogs(prev=>prev.filter(l=>l.id!==id));
        showToast('הרשומה נמחקה');
    };
    const handleDeleteDate = items=>{
        const ids = new Set(items.map(i=>i.id));
        setLogs(prev=>prev.filter(l=>!ids.has(l.id)));
        showToast('יום האימון נמחק');
    };

    const sortedGroups = useMemo(()=>
        groupOrder.map(id=>exerciseGroups.find(g=>g.id===id)).filter(Boolean)
    ,[groupOrder]);

    const handleToggleExercise = useCallback((exId) => {
        setHiddenExercises(prev => {
            const next = new Set(prev);
            if (next.has(exId)) next.delete(exId); else next.add(exId);
            return next;
        });
    }, []);

    // ─── הוספת תרגיל חדש (מותאם אישית) מתוך מסך הניהול ───
    // יוצרת קבוצת תרגיל חדשה, שומרת אותה כדי שתישאר גם אחרי רענון, ומנווטת ישר
    // לעמוד התרגיל שלה — בדיוק כמו כל תרגיל אחר — כדי שאפשר יהיה להעלות תמונה/וידאו ולערוך הוראות.
    const handleAddCustomExercise = useCallback(() => {
        const title = prompt('שם התרגיל החדש:');
        if (!title || !title.trim()) return;
        const t = title.trim();
        const ts = Date.now();
        const newGroup = {
            id: `custom-${ts}`, hex:'#64748b', badgeColor:'bg-slate-100 text-slate-700',
            title: t, category:'מותאם אישית', icon:'⭐', color:'from-slate-500 to-slate-700', machine:'—',
            exercises: [{ id:`custom-${ts}-ex`, title: t, howTo:'', tips:[] }]
        };
        exerciseGroups.push(newGroup);
        LS.set('gym-custom-exercises', [...LS.get('gym-custom-exercises', []), newGroup]);
        setGroupOrder(prev => [...prev, newGroup.id]);
        setActiveGroup(newGroup);
        navigateTo('detail');
        setScrollToExId(newGroup.exercises[0].id);
        showToast('התרגיל נוסף — עכשיו אפשר להוסיף תמונה, וידאו והוראות');
    }, [showToast]);

    const handleDeleteCustomExercise = useCallback((group) => {
        const idx = exerciseGroups.findIndex(eg => eg.id === group.id);
        if (idx >= 0) exerciseGroups.splice(idx, 1);
        LS.set('gym-custom-exercises', LS.get('gym-custom-exercises', []).filter(c => c.id !== group.id));
        setGroupOrder(prev => prev.filter(id => id !== group.id));
        setHiddenExercises(prev => {
            const next = new Set(prev);
            group.exercises.forEach(e => next.delete(e.id));
            return next;
        });
        showToast('התרגיל נמחק');
    }, [showToast]);

    const visibleGroups = useMemo(()=>
        sortedGroups.map(g => {
            const visExs = g.exercises.filter(e => !hiddenExercises.has(e.id));
            if (!visExs.length) return null;
            return {...g, exercises: visExs};
        }).filter(Boolean)
    ,[sortedGroups, hiddenExercises]);

    const handleMoveGroup = (idx, dir) => {
        setGroupOrder(prev=>{
            const next = [...prev];
            const target = idx + dir;
            if (target < 0 || target >= next.length) return prev;
            [next[idx], next[target]] = [next[target], next[idx]];
            return next;
        });
    };

    const isGroupDone = useCallback((g)=>
        skippedGroups.includes(g.id) ||
        g.exercises.every(ex=>{
            const sl = logs.filter(l=>l.exId===ex.id && new Date(l.timestamp).getTime()>workoutStartTime);
            return sl.some(l=>l.setNum===1) && sl.some(l=>l.setNum===2);
        })
    ,[logs,workoutStartTime,skippedGroups]);

    const completedCount    = useMemo(()=>visibleGroups.filter(isGroupDone).length,          [visibleGroups,isGroupDone]);
    const nextIncompleteIndex = useMemo(()=>visibleGroups.findIndex(g=>!isGroupDone(g)),     [visibleGroups,isGroupDone]);

    // רשת ביטחון: מ-4 תרגילים שהושלמו ומעלה, שומרים checkpoint של משך האימון —
    // כדי שאם המשתמש עוזב באמצע (בלי לעבור דרך "אימון חדש") לא ייאבד רישום משך הזמן.
    const checkpointedWstRef = React.useRef(null);
    useEffect(() => {
        if (completedCount > 3 && checkpointedWstRef.current !== workoutStartTime) {
            checkpointedWstRef.current = workoutStartTime;
            if (workoutSec > 0) setSessionDurations(prev=>({...prev,[workoutStartTime]:workoutSec}));
        }
    }, [completedCount, workoutStartTime]); // eslint-disable-line

    // ─── סיכום אימון — בניית snapshot ופתיחה (כולל פתיחה חוזרת מהבית) ───
    const computeSummarySnapshot = (logsArr, wst, durSec, skipped) => {
        const sessionLogs = logsArr.filter(l=>new Date(l.timestamp).getTime()>wst);
        // סט שנרשם דרך "דלג" (משקל 0 וחזרות 0) לא נחשב כסט שבוצע בפועל — כדי שתרגיל
        // שדולג עליו (כולו או חלקו) לא ייספר כ"הושלם" בסיכום האימון
        const isDone = g => skipped.includes(g.id) || g.exercises.every(ex=>{
            const sl = logsArr.filter(l=>l.exId===ex.id && new Date(l.timestamp).getTime()>wst && (l.weight>0 || l.reps>0));
            return sl.some(l=>l.setNum===1) && sl.some(l=>l.setNum===2);
        });
        const doneCount = visibleGroups.filter(g=>!skipped.includes(g.id)&&isDone(g)).length;
        return { workoutStart:wst, durationSec:durSec, doneCount, totalGroups:visibleGroups.length, totalSets:sessionLogs.length, skipCount:skipped.length, ts:Date.now() };
    };
    const openSummary = (snap) => {
        if (!snap) return;
        setSummaryData(snap);
        const wn = workoutNotes[snap.workoutStart] || {};
        setSummaryNote(wn.note || '');
        setSummaryBW(wn.bw ? String(wn.bw) : '');
        setSummarySaved(false); setSummaryBackedUp(false); setEditingDur(false);
        setShowSummary(true);
    };
    // סיכום היסטורי — קירוב סביר מתוך נתוני היום (הושלם = כל תרגילי הקבוצה נרשמו עם סט 1+2 באותו יום)
    const handleShowDaySummary = (date, items) => {
        const wstEntry = Object.keys(sessionDurations||{}).find(ts=>new Date(Number(ts)).toLocaleDateString('he-IL')===date);
        const startTime = wstEntry ? Number(wstEntry) : new Date(items[0].timestamp).getTime();
        const dur = wstEntry ? (sessionDurations[wstEntry]||0) : 0;
        const doneCount = visibleGroups.filter(g=>g.exercises.every(ex=>{
            const s1 = items.some(i=>i.exId===ex.id && i.setNum===1 && (i.weight>0 || i.reps>0));
            const s2 = items.some(i=>i.exId===ex.id && i.setNum===2 && (i.weight>0 || i.reps>0));
            return s1 && s2;
        })).length;
        openSummary({ workoutStart: startTime, durationSec: dur, doneCount, totalGroups: visibleGroups.length, totalSets: items.length, skipCount: 0, ts: startTime + dur*1000 });
        setView('list'); setActiveGroup(null);
    };

    useEffect(()=>{
        if (view!=='list') return;
        setTimeout(()=>{
            const idx = nextIncompleteIndex>0 ? nextIncompleteIndex-1 : 0;
            document.getElementById(`ex-btn-${idx}`)?.scrollIntoView({behavior:'smooth',block:'center'});
        },250);
    },[view,nextIncompleteIndex]);

    const handleSkipGroup = useCallback((groupId)=>{
        setSkippedGroups(prev=>{
            const newSkipped = prev.includes(groupId) ? prev.filter(id=>id!==groupId) : [...prev, groupId];
            const allDone = visibleGroups.every(g=>{
                if (newSkipped.includes(g.id)) return true;
                return g.exercises.every(ex=>{
                    const sl = logs.filter(l=>l.exId===ex.id && new Date(l.timestamp).getTime()>workoutStartTime);
                    return sl.some(l=>l.setNum===1) && sl.some(l=>l.setNum===2);
                });
            });
            if (allDone && newSkipped.length > 0) {
                setTimeout(()=>{
                    setIsWorkoutActive(false); setIsWorkoutComplete(true);
                    setRestTimers({}); setRestTimerTotals({});
                    if (workoutSec > 0) { LS.set('gym-last-workout-sec', workoutSec); setSessionDurations(p=>({...p,[workoutStartTime]:workoutSec})); }
                }, 300);
            }
            return newSkipped;
        });
    },[visibleGroups,logs,workoutStartTime,workoutSec]);

    const handleExerciseComplete = useCallback((isAutoTransition=false)=>{
        const curLogs = logsRef.current;
        const curWst  = sstRef.current;
        const curSkip = skippedRef.current;
        const isDone = g => curSkip.includes(g.id) || g.exercises.every(ex=>{
            const sl = curLogs.filter(l=>l.exId===ex.id && new Date(l.timestamp).getTime()>curWst);
            return sl.some(l=>l.setNum===1) && sl.some(l=>l.setNum===2);
        });
        const nextGroup = visibleGroups.find(g=>!isDone(g));
        if (nextGroup) {
            if (isAutoTransition) {
                const nextEx = nextGroup.exercises[0];
                const doneS1N = curLogs.some(l=>l.exId===nextEx.id&&l.setNum===1&&new Date(l.timestamp).getTime()>curWst);
                const doneS2N = curLogs.some(l=>l.exId===nextEx.id&&l.setNum===2&&new Date(l.timestamp).getTime()>curWst);
                // הסט הבא שמחכה לתרגיל: אם החימום פתוח לתרגיל הזה וטרם בוצע — הוא הסט הבא (לא הסט הרגיל)
                const doneWarmupN = curLogs.some(l=>l.exId===nextEx.id&&l.setNum===0&&new Date(l.timestamp).getTime()>curWst);
                const hasWarmup = !!(settings.warmupEmbed && settings.warmupEmbed[nextEx.id]);
                const isWarmup = hasWarmup && !doneWarmupN;
                const weight = isWarmup ? getLastWarmupWeight(nextEx.id, curLogs) : getNextSetWeight(nextEx.id, curLogs, doneS1N, doneS2N);
                const reps   = isWarmup ? getLastWarmupReps(nextEx.id, curLogs)   : getNextSetReps(nextEx.id, curLogs, doneS1N, doneS2N);
                if (weight > 0) {
                    setAutoTransitionSplash({ title: nextGroup.title, weight, reps, isWarmup, exId: nextEx.id });
                    // ההכרזה בקול היא תמיד על הסט הבא בפועל של התרגיל הבא (חימום אם ממתין, אחרת הסט הרגיל)
                    if (window.speechSynthesis) {
                        window.speechSynthesis.cancel();
                        if (isWarmup) {
                            const u1 = new SpeechSynthesisUtterance('חימום');
                            u1.lang = 'he-IL'; u1.rate = 1.0; u1.volume = 1.0;
                            window.speechSynthesis.speak(u1);
                        }
                        const u2 = new SpeechSynthesisUtterance(String(weight));
                        u2.lang = 'he-IL'; u2.rate = 1.0; u2.volume = 1.0;
                        window.speechSynthesis.speak(u2);
                    }
                }
            }
            setActiveGroup(nextGroup); setView('detail');
            setScrollToExId(nextGroup.exercises[0].id);
        } else {
            // כל התרגילים בוצעו — לא פותחים את מסך הסיכום אוטומטית, רק מסמנים
            // שהאימון הושלם. המשתמש פותח את הסיכום בעצמו בלחיצה על "סוף אימון".
            setIsWorkoutActive(false); setIsWorkoutComplete(true);
            setRestTimers({}); setRestTimerTotals({});
            LS.set('gym-last-workout-sec', workoutSec);
            if (workoutSec > 0) setSessionDurations(prev=>({...prev, [workoutStartTime]: workoutSec}));
            setView('list');
            setActiveGroup(null);
        }
    },[sortedGroups,workoutSec,workoutStartTime]);

    const allGroupsDone = useMemo(()=> visibleGroups.length>0 && visibleGroups.every(isGroupDone), [visibleGroups, isGroupDone]);
    const handleOpenSummaryManual = useCallback(()=>{
        const snap = computeSummarySnapshot(logsRef.current, sstRef.current, workoutSec, skippedRef.current);
        openSummary(snap);
        setView('list'); setActiveGroup(null);
    },[workoutSec, workoutNotes, sortedGroups]);

    const handleOpenExercise = group=>{
        if (!isWorkoutActive) {
            requestConfirm('להפעיל טיימר?',
                ()=>{ const wst=Date.now(); setWorkoutStartTime(wst); setIsWorkoutActive(true); setWorkoutDecisionMade(true); setActiveGroup(group); setView('detail'); },
                ()=>{ setWorkoutDecisionMade(true); setActiveGroup(group); setView('detail'); }
            );
        } else { setActiveGroup(group); setView('detail'); }
    };

    // Overlays — תמיד מעל (כולל audio — נשאר פעיל בכל view)
    const hasActiveRest = Object.keys(restTimers).some(id => (restTimers[id]||0) > 0 && (restTimerTotals[id]||0) > 0);
    const overlays = (
        <>
            <FloatingRestTimer restTimers={restTimers} restTimerTotals={restTimerTotals} logs={logs} visibleGroups={visibleGroups} activeGroup={activeGroup} />
            {autoTransitionSplash && (
                <div className="fixed inset-x-0 z-[900] flex justify-center pointer-events-none"
                    style={{maxWidth:'28rem', margin:'0 auto',
                        ...(splashAnchorTop!=null
                            ? {top:0, height:`${Math.max(8,splashAnchorTop)}px`, alignItems:'flex-end'}
                            : {top:'auto', bottom:'6rem', alignItems:'flex-start'})}}>
                    <div onClick={()=>setAutoTransitionSplash(null)}
                        className="pointer-events-auto text-center bg-slate-900/90 backdrop-blur-sm rounded-3xl px-8 py-5 shadow-2xl mb-2">
                        {autoTransitionSplash.isWarmup && (
                            <div className="text-amber-400 font-black text-sm mb-1">🔥 חימום</div>
                        )}
                        <div className="text-orange-400 font-black" style={{fontSize:'3rem',lineHeight:1.2}}>
                            משקל {autoTransitionSplash.weight}
                        </div>
                        {autoTransitionSplash.reps > 0 && (
                            <div className="text-orange-300/70 font-bold text-xl mt-1">
                                {autoTransitionSplash.reps} חזרות
                            </div>
                        )}
                        <div className="text-white/40 text-sm font-bold mt-3">לחץ לסגירה</div>
                    </div>
                </div>
            )}
            <HamburgerMenu currentView={view} hasActiveRest={hasActiveRest} onNavigate={(v)=>{
                if (v==='list') { navigateTo('list'); setActiveGroup(null); }
                else if (v.startsWith('manage:')) { const sec=v.split(':')[1]; setManageOpenSection(sec); navigateTo('manage'); }
                else navigateTo(v);
            }} />
            <audio ref={audioRef}
                onPlay={()=>setMusicPlaying(true)} onPause={()=>setMusicPlaying(false)}
                onTimeUpdate={()=>{ if(audioRef.current) setAudioCurrentTime(audioRef.current.currentTime); }}
                onLoadedMetadata={()=>{ if(audioRef.current) setAudioDuration(audioRef.current.duration||0); }}
                onError={(e)=>{
                    const code = e.target?.error?.code;
                    const msgs = {1:'הופסק',2:'שגיאת רשת',3:'פענוח נכשל — המר ל-M4A',4:'פורמט לא נתמך — המר ל-M4A'};
                    showToast(`❌ ${msgs[code]||'שגיאת שמע'} (${code||'?'})`, true);
                }}
                onEnded={()=>{
                    const list = musicListRef.current;
                    if (!list.length || !audioRef.current) return;
                    if (list.length === 1) { audioRef.current.currentTime=0; audioRef.current.play().catch(()=>{}); return; }
                    const next = (musicIndex + 1) % list.length;
                    setMusicIndex(next);
                    audioRef.current.src = list[next].url;
                    audioRef.current.play().catch(()=>{});
                }}
                style={{display:'none'}} />
            {/* פאנל מוזיקה — מוצג בכל view */}
            {musicPanelOpen && (
                <div className={`fixed inset-x-0 z-[700] px-3 ${view==='detail' ? 'top-24' : 'top-44'}`} dir="rtl" style={{maxWidth:'28rem',margin:'0 auto'}}
                    onClick={resetMusicPanelTimer}>
                    <div className="bg-slate-900 rounded-2xl px-4 py-3 space-y-2 shadow-2xl border border-slate-700">
                        {musicList.length > 0 && (
                            <div className="space-y-1 max-h-36 overflow-y-auto no-scrollbar">
                                {musicList.map((t,i) => (
                                    <div key={t.id} onClick={()=>setMusicIndex(i)} className={`flex items-center gap-2 px-2 py-1.5 rounded-xl cursor-pointer active:scale-[0.98] ${i===musicIndex?'bg-purple-800/60 ring-1 ring-purple-500':'bg-slate-800/50'}`}>
                                        <span className={`text-[11px] shrink-0 ${i===musicIndex&&musicPlaying?'text-green-400':i===musicIndex?'text-purple-400':'text-slate-500'}`}>
                                            {i===musicIndex&&musicPlaying?'▶':i===musicIndex?'●':'○'}
                                        </span>
                                        <span className="text-[11px] font-bold text-white flex-1 truncate">{t.name}</span>
                                        <button onClick={()=>handleMusicRemoveOne(t.id)} className="text-slate-500 active:text-red-400 shrink-0">
                                            <Icon name="Trash2" size={11}/>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                        {/* seek bar */}
                        {musicList.length > 0 && audioDuration > 0 && (
                            <input type="range" min="0" max={audioDuration} step="1"
                                value={audioCurrentTime}
                                onChange={e=>{ const t=Number(e.target.value); if(audioRef.current) audioRef.current.currentTime=t; setAudioCurrentTime(t); }}
                                className="w-full h-1.5 rounded-full appearance-none cursor-pointer"
                                style={{accentColor:'#a855f7'}} />
                        )}
                        <div className="flex gap-2 items-center">
                            {musicList.length > 0 && (
                                <button onClick={()=>{ const a=audioRef.current; if(!a)return; if(musicPlaying){a.pause();}else{ const sel=musicList[musicIndex]; if(sel){a.src=sel.url; a.load(); a.play().catch(e=>showToast(e.message||'שגיאת פליי',true)); } } }}
                                    className={`px-3 py-1.5 rounded-xl text-[11px] font-black active:scale-95 shrink-0 ${musicPlaying?'bg-rose-500 text-white':'bg-emerald-500 text-white'}`}>
                                    {musicPlaying?'⏸':'▶'}
                                </button>
                            )}
                            {musicList.length > 1 && (
                                <button onClick={()=>{ const next=(musicIndex+1)%musicList.length; setMusicIndex(next); const a=audioRef.current; if(a&&musicList[next]){a.src=musicList[next].url;a.play().catch(()=>{});} }}
                                    className="px-2 py-1.5 rounded-xl text-[11px] font-black bg-slate-700 text-slate-300 active:scale-95 shrink-0">⏭</button>
                            )}
                            {musicList.length > 1 && (
                                <button onClick={()=>{ const prev=(musicIndex - 1 + musicList.length)%musicList.length; setMusicIndex(prev); const a=audioRef.current; if(a&&musicList[prev]){a.src=musicList[prev].url;a.play().catch(()=>{});} }}
                                    className="px-2 py-1.5 rounded-xl text-[11px] font-black bg-slate-700 text-slate-300 active:scale-95 shrink-0">⏮</button>
                            )}
                            <label className="flex-1 flex items-center justify-center gap-1 bg-purple-800/60 text-purple-200 rounded-xl py-1.5 text-[11px] font-black cursor-pointer active:scale-95">
                                <Icon name="Upload" size={12}/> הוסף
                                <input type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.wav,.flac,.m4b,.mp4" multiple className="hidden"
                                    onChange={e=>handleMusicUpload(e.target.files)} />
                            </label>
                            <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer"
                                className="shrink-0 w-8 h-8 flex items-center justify-center rounded-full active:scale-90" style={{background:'#1DB954'}}>
                                <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="12" fill="#1DB954"/><path fill="white" d="M17.9 10.9C14.7 9 9.35 8.8 6.3 9.75c-.5.15-1-.15-1.15-.6-.15-.5.15-1 .6-1.15 3.55-1.05 9.4-.85 13.1 1.35.45.25.6.85.35 1.3-.25.35-.85.5-1.3.25zm-.1 2.8c-.25.35-.7.5-1.05.25-2.7-1.65-6.8-2.15-9.95-1.15-.4.1-.85-.1-.95-.5-.1-.4.1-.85.5-.95 3.65-1.1 8.15-.55 11.25 1.35.3.15.45.65.2 1zm-1.2 2.75c-.2.3-.55.4-.85.2-2.35-1.45-5.3-1.75-8.8-.95-.3.1-.65-.15-.75-.45-.1-.3.15-.65.45-.75 3.8-.85 7.1-.5 9.7 1.1.35.15.4.55.25.85z"/></svg>
                            </a>
                            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"
                                className="shrink-0 w-8 h-8 flex items-center justify-center rounded-xl active:scale-90" style={{background:'#FF0000'}}>
                                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="white" d="M19.6 7.2a2.5 2.5 0 0 0-1.76-1.77C16.25 5 12 5 12 5s-4.25 0-5.84.43A2.5 2.5 0 0 0 4.4 7.2 26 26 0 0 0 4 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.76 1.77C7.75 19 12 19 12 19s4.25 0 5.84-.43a2.5 2.5 0 0 0 1.76-1.77A26 26 0 0 0 20 12a26 26 0 0 0-.4-4.8z"/><path fill="#FF0000" d="M10 15l5.2-3L10 9v6z"/></svg>
                            </a>
                            {musicList.length > 0 && (
                                <button onClick={handleMusicRemoveAll}
                                    className="shrink-0 px-2 py-1.5 bg-slate-700 text-slate-400 rounded-xl active:text-red-400 active:scale-95">
                                    <Icon name="Trash2" size={13}/>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            )}
            {confirmAction && (
                <div className="fixed inset-0 z-[999] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4" dir="rtl">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl">
                        <h3 className="text-lg font-black text-slate-800 mb-5 text-center">{confirmAction.text}</h3>
                        <div className="flex gap-3">
                            <button onClick={()=>{ confirmAction.onCancel?.(); setConfirmAction(null); }} className="flex-1 p-3 rounded-xl font-bold text-slate-500 bg-slate-100 active:scale-95">ביטול</button>
                            <button onClick={()=>{ confirmAction.onConfirm(); setConfirmAction(null); }} className="flex-1 p-3 rounded-xl font-bold text-white bg-blue-600 active:scale-95">אישור</button>
                        </div>
                    </div>
                </div>
            )}
            {/* תיקון 5: AlertCircle לשגיאה, CheckCircle2 להצלחה */}
            {toast && (
                <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[1000] w-[90%] max-w-[300px]">
                    <div className={`px-5 py-3 rounded-2xl shadow-2xl font-black text-sm flex items-center justify-center gap-2 ${toast.isError?'bg-rose-500':'bg-emerald-500'} text-white`}>
                        <Icon name={toast.isError?'AlertCircle':'CheckCircle2'} size={20} /> {toast.msg}
                    </div>
                </div>
            )}
            {/* סיכום אימון */}
            {showSummary && (()=>{
                const sd = summaryData || computeSummarySnapshot(logs, workoutStartTime, workoutSec, skippedGroups);
                const totalSets   = sd.totalSets;
                const doneCount   = sd.doneCount;
                const skipCount   = sd.skipCount;
                const durSec      = sd.durationSec;
                const sumWst      = sd.workoutStart;
                const remaining   = visibleGroups.filter(g=>!isGroupDone(g)).length;
                const allDone     = remaining === 0;
                const showDur     = allDone ? durSec : workoutSec;
                const startTimeStr = new Date(sumWst).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
                const endTimeStr   = allDone ? new Date(sumWst + durSec*1000).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : null;
                return (
                    <div className="fixed inset-0 z-[999] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" dir="rtl">
                        <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl space-y-4">
                            <div className="text-center">
                                <div className="text-4xl mb-1">{allDone ? '🏆' : '⏳'}</div>
                                <h3 className="text-xl font-black text-slate-800">{allDone ? 'כל הכבוד!' : `נשאר עוד ${remaining}`}</h3>
                                <div className="text-[11px] font-bold text-slate-400 mt-1">
                                    התחלה {startTimeStr}{endTimeStr ? ` · סיום ${endTimeStr}` : ''}
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-blue-50 rounded-2xl p-3 text-center cursor-pointer active:scale-95"
                                    onClick={()=>{ if (!allDone) return; setEditingDur(true); }}>
                                    {editingDur ? (
                                        <input type="number" min="0" autoFocus
                                            defaultValue={Math.round(durSec/60)}
                                            onBlur={e=>{
                                                const mins = parseInt(e.target.value,10);
                                                if (!isNaN(mins) && mins>=0) {
                                                    setSessionDurations(prev=>({...prev,[sumWst]:mins*60}));
                                                    setSummaryData(prev=>prev?{...prev,durationSec:mins*60}:prev);
                                                }
                                                setEditingDur(false);
                                            }}
                                            className="w-full text-lg font-black text-blue-600 text-center bg-white rounded-lg outline-none" />
                                    ) : (
                                        <div className="text-lg font-black text-blue-600">{fmtDur(showDur)}</div>
                                    )}
                                    <div className="text-[10px] font-bold text-blue-400">זמן אימון{allDone?' (לחץ לעריכה)':''}</div>
                                </div>
                                <div className="bg-blue-50 rounded-2xl p-3 text-center">
                                    <div className="text-lg font-black text-blue-600">{doneCount}/{sd.totalGroups}</div>
                                    <div className="text-[10px] font-bold text-blue-400">תרגילים</div>
                                </div>
                                <div className="bg-blue-50 rounded-2xl p-3 text-center">
                                    <div className="text-lg font-black text-blue-600">{totalSets}</div>
                                    <div className="text-[10px] font-bold text-blue-400">סטים</div>
                                </div>
                                {skipCount > 0 && (
                                    <div className="col-span-3 bg-orange-50 rounded-2xl p-3 text-center">
                                        <div className="text-lg font-black text-orange-500">{skipCount}</div>
                                        <div className="text-[10px] font-bold text-orange-400">דולגו</div>
                                    </div>
                                )}
                            </div>
                            <textarea
                                value={summaryNote}
                                onChange={e=>{setSummaryNote(e.target.value);setSummarySaved(false);}}
                                placeholder="הערות לאימון זה..."
                                rows={3}
                                className="w-full bg-amber-50/70 border border-amber-200 rounded-2xl p-3 text-[13px] font-bold text-slate-700 outline-none focus:ring-2 focus:ring-amber-400 resize-none" />
                            <div className="bg-sky-50/70 border border-sky-200 rounded-2xl p-3">
                                <div className="flex items-center gap-2">
                                    <Icon name="User" size={18} className="text-sky-500 shrink-0"/>
                                    <label className="text-[12px] font-black text-slate-700 shrink-0">משקל גוף:</label>
                                    <input type="number" step="0.1" min="0" max="300" inputMode="decimal"
                                        value={summaryBW}
                                        onChange={e=>{setSummaryBW(e.target.value);setSummarySaved(false);}}
                                        placeholder="0.0"
                                        className="flex-1 bg-white border border-sky-200 rounded-xl px-3 py-1.5 text-[14px] font-black text-slate-800 outline-none focus:ring-2 focus:ring-sky-400 text-center" />
                                    <span className="text-[11px] font-bold text-slate-400 shrink-0">ק״ג</span>
                                    {bodyweightLog.length > 0 && (
                                        <button onClick={()=>setShowBwStats(s=>!s)} className="p-1.5 bg-sky-100 text-sky-600 rounded-lg active:scale-90 shrink-0" title="היסטוריית משקל">

                                        </button>

                                {showBwStats && (
                                    <div className="mt-2 pt-2 border-t border-sky-200 space-y-1">
                                        {(() => {
                                            const chrono = [...bodyweightLog].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)).slice(-15);
                                            if (chrono.length < 2) return null;
                                            const weights = chrono.map(b=>b.weight);
                                            const min = Math.min(...weights), max = Math.max(...weights);
                                            const range = (max - min) || 1;
                                            const W = 280, H = 64, pad = 6;
                                            const pts = chrono.map((b,i) => [
                                                pad + (i/(chrono.length-1))*(W-2*pad),
                                                H - pad - ((b.weight-min)/range)*(H-2*pad)
                                            ]);
                                            return (
                                                <div className="mb-2">
                                                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:'64px'}}>
                                                        <polyline points={pts.map(p=>p.join(',')).join(' ')} fill="none" stroke="#0284c7" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />

                                                    <div className="flex justify-between text-[10px] font-bold text-sky-400">
                                                        <span>{min} ק״ג</span>
                                                        <span>{max} ק״ג</span>
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                        {[...bodyweightLog].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,8).map(b => (

                                    </div>

                        </div>
                    </div>
                );
            })()}

{devNotes} setDevNotes={setDevNotes} onSaveDevNote={handleSaveDevNote} devNotesDone={devNotesDone} setDevNotesDone={setDevNotesDone}
        filingDirName={filingDirName} filingSupported={filingSupported} connectFilingDir={connectFilingDir} disconnectFilingDir={disconnectFilingDir} saveTextFile={saveTextFile} /></div>;

    // List view
    return (
        <div className="max-w-md mx-auto h-screen flex flex-col overflow-hidden shadow-2xl" dir="rtl">

        {overlays}
        <div className="flex-1 flex flex-col overflow-hidden relative" style={{background:'#eef2f6'}}>
            <header className="bg-white pb-2 rounded-b-[2rem] shadow-lg sticky top-0 z-10 border-b-2 shrink-0 relative" style={{borderBottomColor:'rgba(45,74,111,0.18)'}}>
                {(() => {
                    const start = new Date(sessionStartTime);
                    const end = sessionEndTime ? new Date(sessionEndTime) : null;
                    const now = new Date();
                    const daysTotal = end ? Math.floor((end - start) / (1000*60*60*24)) : 0;
                    const daysPassed = end ? Math.floor((now - start) / (1000*60*60*24)) : 0;
                    const daysRemaining = Math.max(0, daysTotal - daysPassed);
                    const progress = daysTotal > 0 ? Math.min(100, (daysPassed / daysTotal) * 100) : 0;
