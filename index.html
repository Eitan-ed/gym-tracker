// ─── IndexedDB helper (למוזיקה) ────────────────────────────
const IDB = (() => {
    let dbP = null;
    const open = () => {
        if (dbP) return dbP;
        dbP = new Promise((res, rej) => {
            const req = indexedDB.open('gym-tracker-db', 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore('files');
            req.onsuccess = e => res(e.target.result);
            req.onerror   = () => { dbP = null; rej(); };
        });
        return dbP;
    };
    return {
        get: async (key) => {
            try {
                const db = await open();
                return new Promise(res => {
                    const req = db.transaction('files','readonly').objectStore('files').get(key);
                    req.onsuccess = () => res(req.result ?? null);
                    req.onerror   = () => res(null);
                });
            } catch { return null; }
        },
        set: async (key, val) => {
            try {
                const db = await open();
                return new Promise(res => {
                    const tx = db.transaction('files','readwrite');
                    const req = tx.objectStore('files').put(val, key);
                    req.onsuccess = () => res(true);
                    req.onerror   = () => res(false);
                });
            } catch { return false; }
        },
        del: async (key) => {
            try {
                const db = await open();
                return new Promise(res => {
                    const tx = db.transaction('files','readwrite');
                    const req = tx.objectStore('files').delete(key);
                    req.onsuccess = () => res(true);
                    req.onerror   = () => res(false);
                });
            } catch { return false; }
        },
    };
})();

// ─── Roller (Hybrid Picker) ─────────────────────────────────
const DRUM_H    = 48;
const DRUM_VIS  = 7;
const DRUM_HALF = 3;

const Roller = memo(({ value, onChange, min=0, max=250, step=1, drumStep=null, label, isChanged, presets=[], jumpSteps=[], values=null }) => {
    const [open,     setOpen]     = useState(false);
    const [localVal, setLocalVal] = useState(value);

    const listRef    = React.useRef(null);
    const settling   = React.useRef(false);
    const timerRef   = React.useRef(null);
    const fromBtn    = React.useRef(false);

    const effDrumStep = drumStep !== null ? drumStep : step;
    const options = useMemo(() => {
        if (values) return values;
        const o = [];
        for (let v = min; v <= max; v = parseFloat((v + effDrumStep).toFixed(10)))
            o.push(parseFloat(v.toFixed(4)));
        return o;
    }, [min, max, effDrumStep, values]);

    const scrollTo = useCallback((idx, smooth=false) => {
        if (!listRef.current) return;
        listRef.current.scrollTo({ top: idx * DRUM_H, behavior: smooth ? 'smooth' : 'instant' });
    }, []);

    // כשנפתח — אתחל localVal לערך הנוכחי (מעוגל לאפשרות הקרובה אם לא קיים בדיוק)
    useEffect(() => {
        if (!open) return;
        const exact = options.indexOf(value);
        if (exact >= 0) { setLocalVal(value); return; }
        const ni = options.reduce((b, o, i) => Math.abs(o - value) < Math.abs(options[b] - value) ? i : b, 0);
        setLocalVal(options[ni]);
    }, [open]);

    // כשlocalVal משתנה מכפתור — גלול לשם
    useEffect(() => {
        if (!open) return;
        let idx = options.indexOf(localVal);
        if (idx < 0) idx = options.reduce((b,o,i) => Math.abs(o-localVal)<Math.abs(options[b]-localVal)?i:b, 0);
        settling.current = true;
        requestAnimationFrame(() => {
            scrollTo(idx, fromBtn.current);
            fromBtn.current = false;
            setTimeout(() => { settling.current = false; }, 400);
        });
    }, [localVal, open, options, scrollTo]);

    const handleScroll = useCallback(() => {
        if (settling.current) return;
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
            if (!listRef.current) return;
            const idx = Math.round(listRef.current.scrollTop / DRUM_H);
            const c   = Math.min(Math.max(idx, 0), options.length - 1);
            settling.current = true;
            scrollTo(c, true);
            setLocalVal(options[c]);
            setTimeout(() => { settling.current = false; }, 250);
        }, 80);
    }, [options, scrollTo]);

    const adjust = useCallback((delta) => {
        setLocalVal(prev => {
            let idx = options.indexOf(prev);
            if (idx < 0) idx = options.reduce((b,o,i) => Math.abs(o-prev)<Math.abs(options[b]-prev)?i:b, 0);
            const ni = Math.min(Math.max(idx + (values ? delta : Math.round(delta/step)), 0), options.length-1);
            fromBtn.current = true;
            return options[ni];
        });
    }, [options, step, values]);

    const confirm = useCallback(() => { onChange(localVal); setOpen(false); }, [localVal, onChange]);

    return (
        <div className="flex flex-col items-center flex-1">
            <button onClick={() => setOpen(true)}
                className={`w-full h-14 rounded-xl font-black text-[22px] flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-all
                    ${isChanged ? 'bg-blue-50 text-blue-600 ring-2 ring-blue-200' : 'bg-slate-100 text-slate-800'}`}>
                <span>{value}</span>
                <span className="text-[9px] font-black opacity-50 tracking-tighter uppercase">{label}</span>
            </button>
            {open && (
                <div className="fixed inset-0 z-[800] flex items-end" onClick={confirm}>
                    <div className="absolute inset-0 bg-slate-900/50" />
                    <div className="relative w-full bg-white rounded-t-3xl shadow-2xl" onClick={e => e.stopPropagation()}>
                        {/* כותרת */}
                        <div className="flex justify-between items-center px-5 pt-5 pb-2" dir="rtl">
                            <span className="text-base font-black text-slate-700">{label}</span>
                            <button onClick={confirm} className="px-5 py-2 bg-slate-900 text-white rounded-2xl font-black text-sm active:scale-95">אישור</button>
                        </div>
                        {/* מספרים קרובים */}
                        {(() => {
                            const nearby = values ? (()=>{
                                const ci=options.findIndex(v=>Math.abs(v-localVal)<0.01);
                                const si=ci>=0?ci:options.reduce((b,v,i)=>Math.abs(v-localVal)<Math.abs(options[b]-localVal)?i:b,0);
                                return [-3,-2,-1,0,1,2,3].map(d=>options[si+d]).filter(v=>v!=null);
                            })() : [-3,-2,-1,0,1,2,3].map(d => parseFloat((localVal + d*step).toFixed(4))).filter(v => v >= min && v <= max);
                            return (
                                <div className="px-5 pb-2 flex gap-2 overflow-x-auto no-scrollbar justify-center" dir="ltr">
                                    {nearby.map(p => (
                                        <button key={p}
                                            onClick={() => { if (p === localVal) { confirm(); return; } fromBtn.current=true; setLocalVal(p); }}
                                            className={`shrink-0 px-3 py-1.5 rounded-xl text-sm font-black active:scale-95 transition-all
                                                ${p===localVal ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700'}`}>
                                            {p}
                                        </button>
                                    ))}
                                </div>
                            );
                        })()}
                        {/* כפתורי קפיצה */}
                        <div className="px-4 pb-3 flex items-center gap-1.5 justify-center" dir="ltr">
                            {[...jumpSteps].reverse().map(s => (
                                <button key={`-${s}`} onClick={() => adjust(-s)}
                                    className="flex-1 py-5 bg-rose-50 text-rose-600 rounded-xl font-black text-lg active:scale-95 active:bg-rose-100">
                                    -{s}
                                </button>
                            ))}
                            <button onClick={confirm} className="px-3 py-2 bg-slate-900 text-white rounded-xl font-black text-xl min-w-[4.5rem] text-center active:scale-95 active:bg-slate-700">
                                {localVal}
                            </button>
                            {jumpSteps.map(s => (
                                <button key={`+${s}`} onClick={() => adjust(s)}
                                    className="flex-1 py-5 bg-emerald-50 text-emerald-600 rounded-xl font-black text-lg active:scale-95 active:bg-emerald-100">
                                    +{s}
                                </button>
                            ))}
                        </div>
                        {/* גלגלת לכוונון עדין */}
                        <div className="relative mx-6 mb-6" style={{height: DRUM_VIS * DRUM_H + 'px'}}>
                            <div className="absolute inset-x-0 pointer-events-none z-10"
                                style={{top: DRUM_HALF * DRUM_H + 'px', height: DRUM_H + 'px',
                                    background:'rgba(59,130,246,0.07)',
                                    borderTop:'2px solid rgba(59,130,246,0.3)',
                                    borderBottom:'2px solid rgba(59,130,246,0.3)'}} />
                            <div ref={listRef} onScroll={handleScroll}
                                className="h-full overflow-y-scroll no-scrollbar"
                                style={{scrollSnapType:'y mandatory', WebkitOverflowScrolling:'touch'}}>
                                <div style={{height: DRUM_HALF * DRUM_H + 'px'}} />
                                {options.map(o => (
                                    <div key={o} onClick={() => { if (o === localVal) { confirm(); return; } fromBtn.current=true; setLocalVal(o); }}
                                        style={{height: DRUM_H + 'px', scrollSnapAlign:'center'}}
                                        className={`flex items-center justify-center select-none cursor-pointer transition-all
                                            ${o===localVal ? 'font-black text-[22px] text-slate-900' : 'font-medium text-[15px] text-slate-400'}`}>
                                        {o}
                                    </div>
                                ))}
                                <div style={{height: DRUM_HALF * DRUM_H + 'px'}} />
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
});

// ─── PlankTimer ────────────────────────────────────────────
const PLANK_PRESETS = [20,30,45,60,90,120];
function PlankTimer() {
    const [seconds,   setSeconds]   = useState(60);
    const [remaining, setRemaining] = useState(null);
    const [running,   setRunning]   = useState(false);
    const itvRef = React.useRef(null);

    const start = () => { setRemaining(seconds); setRunning(true); };
    const stop  = () => { clearInterval(itvRef.current); setRunning(false); setRemaining(null); };

    useEffect(() => {
        if (!running) return;
        itvRef.current = setInterval(() => {
            setRemaining(r => {
                if (r <= 1) {
                    clearInterval(itvRef.current);
                    setRunning(false);
                    playPhoneRingSound();
                    return 0;
                }
                if (r <= 4) playCountdownBeep();
                return r - 1;
            });
        }, 1000);
        return () => clearInterval(itvRef.current);
    }, [running]);

    const pct = remaining !== null ? (remaining / seconds) * 100 : 100;
    const color = remaining <= 5 ? '#ef4444' : remaining <= 20 ? '#f59e0b' : '#84cc16';

    return (
        <div className="bg-lime-50 rounded-2xl border border-lime-200 p-4 mt-3">
            {remaining === null ? (<>
                <div className="text-[11px] font-black text-lime-600 mb-2">⏱ זמן פלאנק</div>
                <div className="flex gap-1.5 flex-wrap mb-3">
                    {PLANK_PRESETS.map(p => (
                        <button key={p} onClick={()=>setSeconds(p)}
                            className={`px-2.5 py-1 rounded-xl text-[12px] font-black active:scale-95 transition-all
                                ${p===seconds?'bg-lime-500 text-white':'bg-white border border-lime-200 text-lime-700'}`}>
                            {p}″
                        </button>
                    ))}
                </div>
                <div className="flex gap-2 items-center mb-3">
                    <button onClick={()=>setSeconds(s=>Math.max(10,s-5))} className="px-3 py-2 bg-rose-50 text-rose-500 rounded-xl font-black text-sm active:scale-95">-5</button>
                    <div className="flex-1 text-center text-3xl font-black text-slate-800">{seconds}″</div>
                    <button onClick={()=>setSeconds(s=>s+5)} className="px-3 py-2 bg-emerald-50 text-emerald-600 rounded-xl font-black text-sm active:scale-95">+5</button>
                </div>
                <button onClick={start} className="w-full py-3 bg-lime-500 text-white rounded-2xl font-black text-base active:scale-95 shadow-lg shadow-lime-200">
                    ▶ התחל פלאנק
                </button>
            </>) : (<>
                <div className="text-center mb-3">
                    <div className="text-6xl font-black tabular-nums" style={{color}}>{remaining}</div>
                    <div className="text-[11px] font-bold text-slate-400 mt-1">שניות</div>
                </div>
                <div className="h-4 bg-slate-200 rounded-full overflow-hidden mb-3 shadow-inner">
                    <div className="h-full rounded-full transition-all duration-1000" style={{width:`${pct}%`, background:color}} />
                </div>
                <button onClick={stop} className="w-full py-3 bg-slate-700 text-white rounded-2xl font-black text-base active:scale-95">
                    ⏹ עצור
                </button>
            </>)}
        </div>
    );
}

// ─── ExerciseEntryRow ──────────────────────────────────────
function ExerciseEntryRow({ ex, logs, sessionStartTime, onSave, onFinish, isLast, isSuperset, restTimer, restTimerTotal,
    forceSet1Disabled=false, forceSet2Disabled=false, prevRestTimer=0, prevRestTimerTotal=0, accentColor='#3b82f6', requestConfirm=null,
    weightStep=0.5, weightJumpSteps=[0.5,1,5], repsStep=1, repsJumpSteps=[1,2,3,5], weightValues=null }) {
    const isTimerEx = TIMER_EXERCISES.has(ex.id);
    const defW = DEFAULT_STARTING_WEIGHTS[ex.id] ?? (weightValues ? weightValues[0] : 10);
    const defR = DEFAULT_STARTING_REPS[ex.id] ?? 10;
    const [s1, setS1] = useState({ w:defW, r:defR, wC:false, rC:false });
    const [s2, setS2] = useState({ w:defW, r:defR, wC:false, rC:false });

    const weightPresets = useMemo(() => [...new Set(
        [...logs].filter(l=>l.exId===ex.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))
            .slice(0,30).map(l=>l.weight).filter(w=>w>0)
    )].slice(0,5), [logs, ex.id]);

    const repsPresets = useMemo(() => [...new Set(
        [...logs].filter(l=>l.exId===ex.id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))
            .slice(0,30).map(l=>l.reps).filter(r=>r>0)
    )].slice(0,5), [logs, ex.id]);
    const [isSaving, setIsSaving] = useState(false);
    const [bellyTimerSecs, setBellyTimerSecs] = useState(()=>LS.get('gym-belly-timer',60));
    const [timerState, setTimerState] = useState(null); // {num,remaining,total}
    const timerIntervalRef = React.useRef(null);
    const s1Ref = React.useRef(null); const s2Ref = React.useRef(null);

    const cameBack    = React.useRef(false);
    const initialized = React.useRef(false);
    // זיהוי "חזרה" לתרגיל שכבר הסתיים לפני כן
    useEffect(() => { if (done.s1 && done.s2) cameBack.current = true; }, []); // eslint-disable-line
    useEffect(() => {
        if (initialized.current || logs.length === 0) return;
        const exLogs = [...logs].filter(l=>l.exId===ex.id)
            .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
        const lastS1 = exLogs.find(l=>l.setNum===1);
        const lastS2 = exLogs.find(l=>l.setNum===2);
        if (!lastS1 && !lastS2) return;
        if (lastS1) setS1(p=>({...p, w:lastS1.weight, r:lastS1.reps}));
        if (lastS2) setS2(p=>({...p, w:lastS2.weight, r:lastS2.reps}));
        else if (lastS1) setS2(p=>({...p, w:lastS1.weight, r:lastS1.reps}));
        initialized.current = true;
    }, [logs, ex.id]);

    useEffect(() => {
        initialized.current = false;
        setS1(p=>({...p,wC:false,rC:false}));
        setS2(p=>({...p,wC:false,rC:false}));
    }, [sessionStartTime]);

    // refs עדכניים לשימוש בסגירת הטיימר
    useEffect(()=>{ s1Ref.current = s1; },[s1]);
    useEffect(()=>{ s2Ref.current = s2; },[s2]);
    // interval של טיימר בטן — ויזואלי בלבד, ללא שמירה אוטומטית
    useEffect(()=>{
        if (!timerState) { clearInterval(timerIntervalRef.current); return; }
        clearInterval(timerIntervalRef.current);
        timerIntervalRef.current = setInterval(()=>{
            setTimerState(prev=>{
                if (!prev) { clearInterval(timerIntervalRef.current); return null; }
                if (prev.remaining <= 1) {
                    clearInterval(timerIntervalRef.current);
                    playRestCompleteSound();
                    return null; // חוזר לברירת המחדל (bellyTimerSecs)
                }
                if (prev.remaining <= 4) playCountdownBeep();
                return {...prev, remaining: prev.remaining-1};
            });
        },1000);
        return ()=>clearInterval(timerIntervalRef.current);
    },[timerState?.num, !!timerState]);

    const done = useMemo(() => ({
        s1: logs.some(l => l.exId===ex.id && l.setNum===1 && new Date(l.timestamp).getTime()>sessionStartTime),
        s2: logs.some(l => l.exId===ex.id && l.setNum===2 && new Date(l.timestamp).getTime()>sessionStartTime)
    }), [logs, ex.id, sessionStartTime]);

    const stepW = useCallback((w, dir) => {
        if (!weightValues) return parseFloat((dir>0?Math.min(250,w+weightStep):Math.max(0,w-weightStep)).toFixed(4));
        const idx = weightValues.findIndex(v=>Math.abs(v-w)<0.01);
        const si  = idx>=0?idx:weightValues.reduce((b,v,i)=>Math.abs(v-w)<Math.abs(weightValues[b]-w)?i:b,0);
        return weightValues[Math.max(0,Math.min(weightValues.length-1,si+dir))];
    },[weightValues,weightStep]);

    const handleSetSave = async (num, state, skipConfirm=false) => {
        const isDoneSet = num===1 ? done.s1 : done.s2;
        const doSave = async () => {
            setIsSaving(true);
            try {
                await onSave(ex.id, num, state.w, state.r, isSuperset);
                if (!isDoneSet) {
                    if (num===1 && !done.s2) setS2(p=>({...p, w: state.w}));
                    if (num===2 && isLast) setTimeout(()=>onFinish(true), 800);
                }
                if (num===1) setS1(p=>({...p,wC:false,rC:false}));
                else setS2(p=>({...p,wC:false,rC:false}));
            } finally { setIsSaving(false); }
        };
        if (!skipConfirm && cameBack.current && requestConfirm) {
            requestConfirm('לשנות את נתוני הסט?', doSave);
        } else {
            await doSave();
        }
    };

    const handleSkipSet = async (num) => {
        setIsSaving(true);
        try {
            await onSave(ex.id, num, 0, 0, isSuperset);
            if (num === 1) setS2({w:0, r:0, wC:false, rC:false});
            if (num===2 && isLast) setTimeout(()=>onFinish(true), 800);
        } finally { setIsSaving(false); }
    };

    const betweenTimer = done.s1 && !done.s2 && restTimerTotal > 0 && !forceSet2Disabled;

    const conicStyle = (rt, tot) => {
        if (!tot) return null;
        if (rt === 0) return { border:`4px solid ${accentColor}`, borderRadius:'1.6rem', boxShadow:`0 2px 12px ${accentColor}40` };
        const deg = (rt / tot) * 360;
        return {
            border:'4px solid transparent', borderRadius:'1.6rem',
            background:`linear-gradient(white,white) padding-box, conic-gradient(from -90deg, ${accentColor} 0deg, ${accentColor} ${deg}deg, #e2e8f0 ${deg}deg, #e2e8f0 360deg) border-box`
        };
    };

    return (
        <div className="space-y-0" dir="rtl">
            {[1,2].map((num) => {
                const state    = num===1 ? s1 : s2;
                const setState = num===1 ? setS1 : setS2;
                const isDone   = num===1 ? done.s1 : done.s2;
                const canAct   = !isSaving && (isDone ? true : (num===1 ? !forceSet1Disabled : (done.s1 && !forceSet2Disabled)));
                // סופרסט: Set2 ממתין לטיימר של התרגיל האחר — מציג ספירה לאחור
                const isCrossTimerSet2 = num===2 && !isDone && done.s1 && forceSet2Disabled && prevRestTimerTotal > 0 && prevRestTimer > 0;
                const hasConic1 = num===1 && !done.s1 && prevRestTimerTotal > 0;
                const hasConic2 = num===2 && (betweenTimer || isCrossTimerSet2);
                const conicRt   = hasConic2 ? (betweenTimer ? restTimer        : prevRestTimer)        : 0;
                const conicTot  = hasConic2 ? (betweenTimer ? restTimerTotal   : prevRestTimerTotal)   : 0;
                const conic     = hasConic1 ? conicStyle(prevRestTimer, prevRestTimerTotal)
                                : hasConic2 ? conicStyle(conicRt, conicTot)
                                : null;
                const countdown  = hasConic1 ? prevRestTimer : hasConic2 ? conicRt : 0;
                const showCDown  = !isDone && countdown > 0;
                const timerDone  = !isDone && !conic && (
                    (hasConic1 && prevRestTimer===0 && prevRestTimerTotal>0) ||
                    (num===2 && betweenTimer && restTimer===0)
                );
                const isActive    = !conic && canAct;
                const canActFinal = canAct || showCDown;
                return (
                    <React.Fragment key={num}>
                        <div style={conic || (isActive ? {border:`2px solid ${accentColor}`, boxShadow:`0 4px 16px ${accentColor}30`, borderRadius:'1.6rem'} : isDone ? {border:'2px solid #94a3b8', borderRadius:'1.6rem'} : undefined)}
                            className={`p-3 rounded-[1.6rem] flex items-center gap-2 transition-all
                                ${isDone   ? 'bg-slate-300' : 'bg-white'}
                                ${conic    ? ''
                                : isActive ? ''
                                : isDone   ? ''
                                : timerDone? 'border border-slate-700 shadow-md'
                                :            'border border-slate-100 shadow-sm'}`}>
                            <div className="w-8 h-14 text-white rounded-xl flex flex-col items-center justify-center shrink-0 shadow-lg"
                                style={{background: (isActive || timerDone) ? accentColor : isDone ? '#64748b' : '#0f172a'}}>
                                <span className="text-[7px] font-black uppercase tracking-tighter opacity-60">SET</span>
                                <span className="text-base font-black leading-none">{num}</span>
                            </div>
                            <div className="flex flex-1 gap-1.5">
                                <div className="flex items-stretch flex-1 gap-0.5">
                                    <button onClick={()=>setState(p=>({...p,w:stepW(p.w,1),wC:true}))}
                                        className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-2xl active:bg-emerald-100 shrink-0 flex items-center justify-center">+</button>
                                    <Roller label="ק״ג" min={0} max={250} step={weightStep} drumStep={weightValues?null:1} value={state.w} isChanged={state.wC}
                                        onChange={v=>{setState(p=>({...p,w:v,wC:true}));}}
                                        presets={weightPresets} jumpSteps={weightValues?[1,2,3]:weightJumpSteps} values={weightValues} />
                                    <button onClick={()=>setState(p=>({...p,w:stepW(p.w,-1),wC:true}))}
                                        className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-2xl active:bg-rose-100 shrink-0 flex items-center justify-center">−</button>
                                </div>
                                {/* אזור חזרות / טיימר בטן */}
                                {isTimerEx ? (
                                <div className="flex flex-col flex-1 gap-1">
                                    {(!timerState||timerState.num!==num) && !isDone && (
                                        <div className="flex gap-1">
                                            {[10,20,30,40].map(d=>{const t=bellyTimerSecs+d; return (
                                                <button key={d} onClick={()=>{setBellyTimerSecs(t);LS.set('gym-belly-timer',t);}}
                                                    className="flex-1 py-0.5 rounded-lg text-[10px] font-black active:scale-95 bg-slate-100 text-slate-600 active:bg-teal-100">
                                                    {t}″</button>
                                            );})}
                                        </div>
                                    )}
                                    <div className="flex items-stretch gap-0.5">
                                        {(!timerState||timerState.num!==num) && !isDone && (
                                            <button onClick={()=>{const v=Math.max(10,bellyTimerSecs-10);setBellyTimerSecs(v);LS.set('gym-belly-timer',v);}}
                                                className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-sm active:bg-rose-100 shrink-0 flex items-center justify-center">-10</button>
                                        )}
                                        <div onClick={()=>{
                                            if (isDone) return;
                                            if (timerState?.num===num) {
                                                clearInterval(timerIntervalRef.current); setTimerState(null);
                                            } else if (!timerState) {
                                                setTimerState({num, remaining:bellyTimerSecs, total:bellyTimerSecs});
                                            }
                                        }} className={`flex-1 h-14 rounded-xl flex flex-col items-center justify-center cursor-pointer active:scale-95
                                            ${timerState?.num===num?'bg-teal-50 ring-2 ring-teal-300':'bg-slate-100 active:bg-teal-50'}`}>
                                            <span className={`font-black text-[22px] ${timerState?.num===num?'text-teal-700':'text-slate-800'}`}>
                                                {timerState?.num===num ? timerState.remaining : (isDone ? (state.r||bellyTimerSecs) : bellyTimerSecs)}
                                            </span>
                                            <span className="text-[9px] font-black opacity-50 tracking-tighter uppercase">{timerState?.num===num?'▐▐ עצור':'▶ שנ׳'}</span>
                                        </div>
                                        {(!timerState||timerState.num!==num) && !isDone && (
                                            <button onClick={()=>{const v=Math.min(300,bellyTimerSecs+10);setBellyTimerSecs(v);LS.set('gym-belly-timer',v);}}
                                                className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-sm active:bg-emerald-100 shrink-0 flex items-center justify-center">+10</button>
                                        )}
                                    </div>
                                </div>
                                ) : (
                                <div className="flex items-stretch flex-1 gap-0.5">
                                    <button onClick={()=>setState(p=>({...p,r:Math.min(120,p.r+repsStep),rC:true}))}
                                        className="w-9 bg-emerald-50/70 text-emerald-400 rounded-xl font-black text-2xl active:bg-emerald-100 shrink-0 flex items-center justify-center">+</button>
                                    <Roller label="חזרות" min={1} max={120} step={repsStep} value={state.r} isChanged={state.rC}
                                        onChange={v=>setState(p=>({...p,r:v,rC:true}))}
                                        presets={repsPresets} jumpSteps={repsJumpSteps} />
                                    <button onClick={()=>setState(p=>({...p,r:Math.max(1,p.r-repsStep),rC:true}))}
                                        className="w-9 bg-rose-50/70 text-rose-400 rounded-xl font-black text-2xl active:bg-rose-100 shrink-0 flex items-center justify-center">−</button>
                                </div>
                                )}
                            </div>
                            <button onClick={() => {
                                if (!canActFinal) return;
                                if (isTimerEx) {
                                    if (timerState?.num===num) { clearInterval(timerIntervalRef.current); setTimerState(null); }
                                    handleSetSave(num, {...state, r:bellyTimerSecs}); return;
                                }
                                handleSetSave(num, state);
                            }}
                                disabled={!canActFinal}
                                className={`w-14 h-14 rounded-2xl flex items-center justify-center font-black text-[14px] transition-all active:scale-95 shrink-0
                                    ${isDone && (state.wC||state.rC) ? 'bg-amber-100 text-amber-700 shadow-amber-100 shadow-md'
                                    : isDone    ? 'bg-slate-100 text-slate-400 shadow-none'
                                    : showCDown ? 'bg-blue-600 text-white shadow-blue-200 shadow-lg active:bg-blue-700 text-[16px]'
                                    : !canAct   ? 'bg-slate-100 text-slate-300 shadow-none'
                                    : 'bg-emerald-500 text-white shadow-emerald-200 shadow-lg'}`}>
                                {isDone && (state.wC||state.rC) ? 'עדכן'
                                : isDone ? 'בוצע'
                                : isSaving ? '...'
                                : showCDown ? countdown : 'סיום'}
                            </button>
                        </div>
                        {num===1 && <div className="h-1.5" />}
                    </React.Fragment>
                );
            })}

        </div>
    );
}

// ─── DetailView ────────────────────────────────────────────
const DetailView = memo(function DetailView({ group, logs, notes, onSaveNote, images, onSaveImage, onRemoveImage, videos, onSaveVideo, onDeleteVideo, onBack, onFinish, onSave, sessionStartTime, restTimers, restTimerTotals, scrollToExId, onScrollDone, onDeleteLog, requestConfirm, groupIdx=0, totalGroups=1, nextGroup=null, prevGroup=null, onNavigateTo, musicList=[], musicPlaying=false, onMusicToggle=null, weightStepsOverrides={}, onOpenSummary=null, allGroupsDone=false,
    workoutSec=0, isWorkoutActive=false, onToggleWorkout=null }) {
    const [lightbox,      setLightbox]     = useState(null);
    const [videoModal,    setVideoModal]   = useState(null);
    const [playingVideos, setPlayingVideos]= useState({});
    const [showDetails,   setShowDetails]  = useState(()=>{
        const saved = LS.get('gym-show-details', null);
        if (saved) return saved;
        return group.exercises.reduce((acc,ex)=>({...acc,[ex.id]:!group.isSuperset}),{});
    });
    const [historyOpen, setHistoryOpen] = useState(()=>LS.get('gym-hist-open', {}));
    useEffect(()=>{ LS.set('gym-hist-open', historyOpen); },[historyOpen]);
    const scrollRef = React.useRef(null);
    useEffect(()=>{ LS.set('gym-show-details', showDetails); },[showDetails]);

    // כניסה לתרגיל: תמיד מתחילים מראש הדף (כותרת + תמונה גלויים)
    useEffect(()=>{
        setTimeout(()=>{ scrollRef.current?.scrollTo({ top: 0, behavior: 'auto' }); }, 30);
    }, [group.id]);

    useEffect(()=>{
        if (!scrollToExId) return;
        setShowDetails(p => ({...p, [scrollToExId]: false}));
        const doScroll = () => {
            // תרגיל ראשון בקבוצה: גלול לראש הדף כדי שהכותרת והתמונה יהיו גלויים במלואם
            if (scrollToExId === group.exercises[0].id) {
                scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            const el = scrollRef.current?.querySelector(`#ex-row-${scrollToExId}`);
            if (el && scrollRef.current) {
                const offset = el.offsetTop - scrollRef.current.getBoundingClientRect().top +
                               scrollRef.current.scrollTop;
                scrollRef.current.scrollTo({ top: Math.max(0, offset - 160), behavior:'smooth' });
            }
        };
        setTimeout(doScroll, 60);
        onScrollDone?.();
    }, [scrollToExId]);

    // ── renderEx: מרנדר בלוק תרגיל אחד ──
    const renderEx = (ex, exIdx, { isLast=false, isSuperset:exIsSuperset=false,
        forceSet1Disabled=false, forceSet2Disabled=false,
        prevRestTimer=0, prevRestTimerTotal=0 } = {}) => {
        const accentHex  = group.hex || '#3b82f6';
        const isTimerEx  = TIMER_EXERCISES.has(ex.id);
        // exHistory מנוהל inline בבלוק ההיסטוריה הcollapsible

        const isPersonal = !!imgSrc;
        const youtubeId  = videos?.[ex.id];
        const localVid   = EXERCISE_VIDEOS[ex.id];
        const hasVideo   = youtubeId || localVid;
        // משקל + חזרות של הסט הראשון העדכני ביותר — מוצג בכתום ליד התמונה
        const exHistSorted = [...logs].filter(l=>l.exId===ex.id)
            .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
        const lastLog1 = exHistSorted.find(l=>l.setNum===1) || exHistSorted[0] || null;
        const lastW = lastLog1?.weight ?? 0;
        const lastR = lastLog1?.reps ?? 0;

        // טיימר prev — רק מתרגיל בקבוצה הנוכחית (לא לעבור בין קבוצות)
        let fPrevRt = prevRestTimer, fPrevTot = prevRestTimerTotal;

        // skip active set
        const doneS1Ex = logs.some(l=>l.exId===ex.id&&l.setNum===1&&new Date(l.timestamp).getTime()>sessionStartTime);
        const doneS2Ex = logs.some(l=>l.exId===ex.id&&l.setNum===2&&new Date(l.timestamp).getTime()>sessionStartTime);
        const skipActiveNum = !doneS1Ex ? 1 : !doneS2Ex ? 2 : null;
        const handleHowToSkip = skipActiveNum ? () => {
            onSave(ex.id, skipActiveNum, 0, 0, exIsSuperset);

        } : null;

        const videoBtn = (full) => youtubeId ? (

                    style={{minHeight: full ? '5rem' : '3.5rem'}}>

                style={{minHeight: full ? '5rem' : '3.5rem'}}>
                <span className="text-2xl">▶</span><span className="text-[11px]">סרטון</span>

        // טיימר כולל של האימון (כמו בדף הראשי) — מוצג בחצי אזור הווידאו
        const wTimerStr = `${String(Math.floor(workoutSec/60)).padStart(2,'0')}:${String(workoutSec%60).padStart(2,'0')}`;

                    </div>
                ) : (
                    /* תרגיל רגיל */
                    <>
                        {(
                            <div className="flex gap-2 mb-0">
                                {dispImgSrc && (
                                    <div className="relative flex-1 min-w-0">
                                        <img src={dispImgSrc} alt={ex.title} onClick={()=>setLightbox(dispImgSrc)}
                                            className="w-full rounded-2xl object-cover shadow cursor-pointer active:opacity-80" style={{maxHeight:'9rem'}} />
                                        {isPersonal && <button onClick={()=>onRemoveImage(ex.id)}

                    const dateKeys = [...new Set(hist10.map(h=>new Date(h.timestamp).toLocaleDateString('he-IL')))];
                    const palettes = [
                        'bg-indigo-50 border-indigo-200 text-indigo-700',
                        'bg-violet-50 border-violet-200 text-violet-700',
                        'bg-sky-50 border-sky-200 text-sky-700',
                        'bg-teal-50 border-teal-200 text-teal-700',
                    ];
                    const isOpen = !!historyOpen[ex.id];
                    return (

// ─── Backup helper ─────────────────────────────────────────
// גיבוי גורף — אוסף כל מפתח gym-* מ-localStorage כדי ששום נתון לא ייפול
const BACKUP_SKIP_KEYS = new Set(['gym-last-backup', 'gym-music-list']);
const collectAllGymData = () => {
    const all = {};
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('gym-') && !BACKUP_SKIP_KEYS.has(k)) {
                try { all[k] = JSON.parse(localStorage.getItem(k)); }
                catch { all[k] = localStorage.getItem(k); }
            }
        }
    } catch {}
    return all;
};
let _backupDirHandle = null;
const getBackupDirName = () => _backupDirHandle?.name || null;

const triggerBackupDownload = async (data) => {
    const payload = { ...data, _all: collectAllGymData() };
    const json = JSON.stringify(payload, null, 2);
    const fname = `gym-backup-${new Date().toLocaleDateString('he-IL').replace(/\./g,'-')}.json`;
    if (window.showSaveFilePicker) {
        try {
            const opts = { suggestedName: fname, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] };
            if (_backupDirHandle) opts.startIn = _backupDirHandle;
            const fh = await window.showSaveFilePicker(opts);
            const writable = await fh.createWritable();
            await writable.write(json);
            await writable.close();
            try { _backupDirHandle = await fh.getParent?.(); } catch {}
            return true;
        } catch (e) { if (e.name === 'AbortError') return false; }
    }
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.click();
    URL.revokeObjectURL(url);
    return true;
};

const triggerBackupRestore = async () => {
    if (window.showOpenFilePicker) {
        try {
            const opts = { types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }], multiple: false };
            if (_backupDirHandle) opts.startIn = _backupDirHandle;
            const [fh] = await window.showOpenFilePicker(opts);
            const file = await fh.getFile();
            try { _backupDirHandle = await fh.getParent?.(); } catch {}
            return file;
        } catch (e) { if (e.name === 'AbortError') return null; }
    }
    return null;
};

// ─── Sound helpers ─────────────────────────────────────────
let _muteTimeout = null;
const playCountdownBeep = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'sine';
        gain.gain.setValueAtTime(0.9, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.18);
    } catch(e) {}
};
const playWarningBeep = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.3].forEach(offset => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 520; osc.type = 'sine';
            gain.gain.setValueAtTime(0.9, ctx.currentTime + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.22);
            osc.start(ctx.currentTime + offset); osc.stop(ctx.currentTime + offset + 0.22);
        });
    } catch(e) {}
};
const playRestCompleteSound = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [500, 700, 950].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(1.0, ctx.currentTime + i * 0.22);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.22 + 0.25);
            osc.start(ctx.currentTime + i * 0.22); osc.stop(ctx.currentTime + i * 0.22 + 0.28);
        });
    } catch(e) {}
};
const playPhoneRingSound = () => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [[0, 0.5], [0.7, 1.2], [1.4, 1.9]].forEach(([s, e]) => {
            [440, 480].forEach(freq => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq; osc.type = 'sine';
                gain.gain.setValueAtTime(0, ctx.currentTime + s);
                gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + s + 0.02);
                gain.gain.setValueAtTime(0.4, ctx.currentTime + e - 0.02);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + e);
                osc.start(ctx.currentTime + s); osc.stop(ctx.currentTime + e);
            });
        });
    } catch(e) {}
};

// ─── WorkoutProgressCalendar ───────────────────────────────
const WorkoutProgressCalendar = ({ logs }) => {
    const [cur, setCur] = useState(() => { const d=new Date(); return {y:d.getFullYear(),m:d.getMonth()}; });
    const workoutDays = useMemo(() => {
        const s = new Set();
        logs.forEach(l => { const d=new Date(l.timestamp); if(d.getFullYear()===cur.y&&d.getMonth()===cur.m) s.add(d.getDate()); });
        return s;
    }, [logs, cur]);
    const avgPerWeek = useMemo(() => {
        const allDays = new Set(logs.map(l => { const d=new Date(l.timestamp); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }));
        if (allDays.size === 0) return '0';
        const ts = logs.map(l=>new Date(l.timestamp).getTime());
        const weeks = Math.max(1, (Date.now() - Math.min(...ts)) / (7*24*3600*1000));
        return (allDays.size / weeks).toFixed(1);
    }, [logs]);
    const daysInMonth = new Date(cur.y, cur.m+1, 0).getDate();
    const firstDay    = new Date(cur.y, cur.m, 1).getDay();
    const monthName   = new Date(cur.y, cur.m, 1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});
    const today       = new Date();
    const isCurMonth  = today.getFullYear()===cur.y && today.getMonth()===cur.m;
    const prev = () => setCur(p=>{ const d=new Date(p.y,p.m-1); return {y:d.getFullYear(),m:d.getMonth()}; });
    const next = () => setCur(p=>{ const d=new Date(p.y,p.m+1); return {y:d.getFullYear(),m:d.getMonth()}; });
    return (
        <div className="px-5 pb-5">
            <div className="flex items-center justify-between mb-3" dir="ltr">
                <button onClick={prev} className="p-2 bg-slate-100 rounded-xl active:scale-95 active:bg-slate-200">
                    <Icon name="ChevronLeft" size={16} className="text-slate-600" />
                </button>
                <div className="text-center">
                    <div className="font-black text-slate-800 text-sm">{monthName}</div>

                        <div key={day} className={`aspect-square rounded-xl flex items-center justify-center text-[12px] font-black

                })}
            </div>
        </div>
    );
};

// ─── ManageView ────────────────────────────────────────────
const ManageView = ({ logs, notes, images, videos, settings, sessionStartTime, sessionEndTime, groupOrder, onBack, onBackToPrev, canBackToPrev=false, onUpdateSettings, requestConfirm, showToast, setLogs, setNotes, setImages, setVideos, setSessionStartTime, setSessionEndTime, setGroupOrder,

    const DEFAULT_REPORT_PREAMBLE = `אתה מאמן כושר בוגר עם תעודת וינגייט, דיאטן ומומחה בתזונה, בעל הכשרה כרופא ספורט, מומחה באימון אנשים מבוגרים מעל גיל 50, בעל ניסיון של 15 שנים.\nאתה המאמן כושר של איתן והתפקיד שלך זה לגרום לו להשיג 3 מטרות:\n1. חיטוב של הגוף לרמה של שרירים וחיטוב יפים\n2. הורדה במשקל (בעיקר באמצעות תזונה ולא סיבולת לב ריאה באימונים)\n3. שמירה על העצמות, שמירה מפציעות, התייחסות לכך שמדובר באדם בגיל 50\n\nנא לנתח את הדוח ולספק:\n\n1. סיכום כללי — מגמות עיקריות, התקדמות, ונקודות חוזק.\n   אם יש נקודה שדורשת שיפור — תן המלצה מפורטת ומעשית (מה בדיוק לעשות, כמה, ואיך).\n\n2. ניתוח עומסים — האם יש עלייה עקבית במשקלים? היכן יש סטגנציה?\n   בכל מקום שמזוהה בעיה — תן המלצה קונקרטית לשיפור.\n\n3. זמני מנוחה — האם זמני המנוחה בין הסטים מתאימים לסוג התרגיל ולמטרות?\n   אם לא — המלץ על זמן מנוחה ספציפי לכל תרגיל.\n\n4. איזון שרירי — האם יש קבוצות שריר שמקבלות פחות תשומת לב?\n   אם כן — המלץ על תרגילים ספציפיים להוספה.\n\n5. תדירות ונפח — האם תדירות האימונים ומספר הסטים מתאימים?\n\n6. המלצות — שינויים מוצעים בתוכנית, משקלים, או מבנה האימון.\n   המלצות מפורטות בלבד — מה לעשות, איפה, וכמה.\n\n7. הערות בטיחות — סימנים לעומס יתר או סיכון לפציעה.\n\nעקרונות מנחים:\n• כבד תוכנית שנמשכת לפרק זמן ללא שינוי מהותי — התמדה עדיפה על שלמות.\n• אל תמליץ על שינוי רק כי ניתן לשפר. המלץ רק כשיש צורך אמיתי.\n• שים לב להערות שנרשמו לגבי תרגילים ואימונים — הן מכילות מידע חשוב.`;

                    if (data.workoutNotes)     { LS.set('gym-workout-notes',     data.workoutNotes);     setWorkoutNotes?.(data.workoutNotes); }

                        <Icon name={open.reports?'ChevronUp':'ChevronDown'} size={18} className="text-slate-400" />
                    </button>
                    {open.reports && <div className="px-5 pb-5 space-y-3">
                        {(()=>{
                            const generateReport = (period) => {
                                const now = new Date();
                                let fromDate;
                                let periodLabel;
                                if (period === 'day') { fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); periodLabel = `יומי — ${now.toLocaleDateString('he-IL')}`; }
                                else if (period === 'week') { fromDate = new Date(now.getTime() - 7*86400000); periodLabel = `שבועי — ${fromDate.toLocaleDateString('he-IL')} עד ${now.toLocaleDateString('he-IL')}`; }
                                else if (period === 'month') { fromDate = new Date(now.getFullYear(), now.getMonth()-1, now.getDate()); periodLabel = `חודשי — ${fromDate.toLocaleDateString('he-IL')} עד ${now.toLocaleDateString('he-IL')}`; }
                                else { fromDate = new Date(0); periodLabel = 'כולל — כל הזמנים'; }
                                const filtered = logs.filter(l => new Date(l.timestamp) >= fromDate).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
                                if (!filtered.length) { showToast('אין נתונים לתקופה זו', true); return; }
                                const grouped = {};
                                filtered.forEach(l => {
                                    const d = new Date(l.timestamp).toLocaleDateString('he-IL');
                                    if (!grouped[d]) grouped[d] = [];
                                    grouped[d].push(l);
                                });
                                const planStart = new Date(sessionStartTime).toLocaleDateString('he-IL');
                                const planEnd = sessionEndTime ? new Date(sessionEndTime).toLocaleDateString('he-IL') : 'לא נקבע';
                                const totalDays = Object.keys(grouped).length;
                                const totalSets = filtered.length;
                                const visibleCount = exerciseGroups.filter(g=>!hiddenExercises.has(g.id)).length;
                                const totalExercises = new Set(filtered.map(l=>l.exId)).size;
                                const totalDurSec = Object.entries(sessionDurations||{}).filter(([ts])=>{
                                    const d = new Date(Number(ts));
                                    return d >= fromDate && d <= now;
                                }).reduce((s,[,v])=>s+v, 0);
                                const avgDurMin = totalDays > 0 ? Math.round(totalDurSec / totalDays / 60) : 0;
                                const daysInPeriod = Math.max(1, Math.ceil((now - fromDate) / 86400000));
                                const freqPerWeek = totalDays > 0 ? (totalDays / daysInPeriod * 7).toFixed(1) : '0';

                                let txt = `דוח אימונים — ${periodLabel}\n`;
                                txt += `${'═'.repeat(40)}\n\n`;
                                txt += `תקופת תוכנית: ${planStart} — ${planEnd}\n`;
                                txt += `סה"כ: ${totalSets} סטים | ${totalExercises} תרגילים (${visibleCount} גלויים מתוך ${exerciseGroups.length})\n`;
                                txt += `ימי אימון: ${totalDays} | תדירות: ${freqPerWeek} אימונים/שבוע | ממוצע זמן אימון: ${avgDurMin} דק׳\n\n`;
                                const orderedNames = groupOrder.map(id=>exerciseGroups.find(g=>g.id===id)).filter(Boolean).map(g=>g.title);
                                txt += `סדר תרגילים: ${orderedNames.join(' → ')}\n`;
                                const hiddenNames = exerciseGroups.filter(g=>hiddenExercises.has(g.id)).map(g=>g.title);
                                if (hiddenNames.length > 0) txt += `תרגילים מוסתרים: ${hiddenNames.join(', ')}\n`;
                                txt += '\n';
                                Object.entries(grouped).forEach(([date, items]) => {
                                    const dayName = getDayNameHe(items[0].timestamp);
                                    const dur = Object.entries(sessionDurations||{}).find(([ts])=>new Date(Number(ts)).toLocaleDateString('he-IL')===date)?.[1];
                                    const wst = Object.keys(sessionDurations||{}).find(ts=>new Date(Number(ts)).toLocaleDateString('he-IL')===date);
                                    const wn = wst ? (workoutNotes||{})[wst] : null;
                                    const bwEnt = (bodyweightLog||[]).find(b=>new Date(b.timestamp).toLocaleDateString('he-IL')===date);
                                    const bwVal = wn?.bw || bwEnt?.weight;
                                    txt += `── ${date} (יום ${dayName})${dur>0?' — '+Math.floor(dur/60)+' דק׳':''} ──\n`;
                                    if (bwVal > 0) txt += `  ⚖️ משקל גוף: ${bwVal} ק״ג\n`;
                                    if (wn?.note) txt += `  📝 הערת אימון: ${wn.note}\n`;
                                    const byEx = {};
                                    items.forEach(l => {
                                        const ex = exerciseGroups.flatMap(g=>g.exercises).find(e=>e.id===l.exId);
                                        const name = ex?.title || l.exId;
                                        if (!byEx[l.exId]) byEx[l.exId] = {name, sets:[]};
                                        byEx[l.exId].sets.push(l);
                                    });
                                    Object.values(byEx).forEach(({name, sets}) => {
                                        const grp = exerciseGroups.find(g=>g.exercises.some(e=>e.id===sets[0]?.exId));
                                        const restSec = grp?.isSuperset ? (settings.supersetRest||60) : (settings.normalRest||90);
                                        txt += `  ${name}: (מנוחה: ${restSec} שנ׳)\n`;
                                        sets.forEach(s => { txt += `    סט ${s.setNum}: ${s.weight} kg × ${s.reps} חזרות\n`; });
                                        const maxW = Math.max(...sets.map(s=>s.weight));
                                        if (maxW > 0) txt += `    ◆ מקסימום: ${maxW} kg\n`;
                                        const exNote = (notes||{})[sets[0]?.exId];
                                        if (exNote) txt += `    📋 הערה: ${exNote}\n`;
                                    });
                                    txt += '\n';
                                });
                                txt += `${'═'.repeat(40)}\n`;
                                txt += `הנחיות לניתוח AI\n`;
                                txt += `${'─'.repeat(40)}\n`;
                                txt += reportPreamble + '\n';

                                const blob = new Blob(['﻿'+txt], {type:'text/plain;charset=utf-8'});
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                const fname = `gym-report-${period}-${now.toISOString().slice(0,10)}.txt`;
                                a.href = url; a.download = fname; a.click();
                                URL.revokeObjectURL(url);
                                showToast(`דוח ${periodLabel.split('—')[0].trim()} נשמר`);
                            };
                            return (<>
                                <div className="mb-3">
                                    <div className="text-sm font-black text-slate-600 mb-2">הנחיות מקדימות לדוח</div>
                                    <textarea value={reportPreamble} onChange={e=>setReportPreamble(e.target.value)}
                                        className="w-full h-40 p-3 text-xs font-mono text-slate-700 bg-slate-50 border border-slate-200 rounded-2xl resize-y" dir="rtl" />
                                    <button onClick={()=>{setReportPreamble(DEFAULT_REPORT_PREAMBLE);showToast('הנחיות אופסו לברירת מחדל');}}
                                        className="text-[10px] font-bold text-slate-400 mt-1 active:text-slate-600">איפוס לברירת מחדל</button>
                                </div>
                                {[
                                    {period:'day', label:'דוח יומי', desc:'סטים ומשקלים של היום'},
                                    {period:'week', label:'דוח שבועי', desc:'7 ימים אחרונים'},
                                    {period:'month', label:'דוח חודשי', desc:'30 ימים אחרונים'},
                                    {period:'all', label:'דוח כולל', desc:'כל הנתונים'}
                                ].map(({period,label,desc}) => (
                                    <button key={period} onClick={()=>generateReport(period)} className="w-full flex items-center gap-3 bg-slate-50 border-slate-200 text-slate-700 p-4 rounded-2xl border active:scale-[0.98]">
                                        <div className="bg-slate-200 p-2 rounded-xl"><Icon name="Download" size={20} /></div>
                                        <div><div className="font-black text-sm">{label}</div><div className="text-[10px] font-bold opacity-70">{desc}</div></div>
                                    </button>
                                ))}
                            </>);
                        })()}
                    </div>}
                </section>
                {/* ── ש: שעות פתיחת מכון ── */}
                <section ref={gymInfoRef} style={{order:ord('gymInfo')}} className={`bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden shrink-0`}>
                    <button onClick={()=>toggleSection('gymInfo')} className="w-full flex items-center justify-between px-5 py-4 active:bg-slate-50 shrink-0">
                        <h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Icon name="Clock" size={20} className="text-blue-500" /> שעות פתיחת מכון</h3>
                        <Icon name={open.gymInfo?'ChevronUp':'ChevronDown'} size={18} className="text-slate-400" />
                    </button>
                    {open.gymInfo && <div className="px-5 pb-5 space-y-3">
                        <div className="bg-slate-50 rounded-2xl border border-slate-100 p-4 space-y-2">
                            <div className="flex items-center gap-2 text-sm font-black text-slate-700"><Icon name="Clock" size={16} className="text-blue-400" /> שעות פתיחה</div>
                            <div className="space-y-1 text-[13px] font-bold text-slate-600 mr-6">
                                <div className="flex justify-between"><span>א׳ – ה׳</span><span className="font-black text-slate-800" dir="ltr">06:00 – 23:00</span></div>
                                <div className="flex justify-between"><span>ו׳</span><span className="font-black text-slate-800" dir="ltr">06:00 – 16:00</span></div>
                                <div className="flex justify-between"><span>ש׳</span><span className="font-black text-slate-800" dir="ltr">08:00 – 13:00</span></div>
                            </div>
                        </div>
                        <a href="tel:*6628" className="flex items-center gap-3 bg-green-50 p-4 rounded-2xl border border-green-100 text-green-700 active:scale-[0.98]">
                            <div className="bg-green-100 p-2 rounded-xl"><Icon name="Phone" size={20} /></div>
                            <div><div className="font-black text-sm">טלפון</div><div className="text-[13px] font-bold" dir="ltr">*6628</div></div>
                        </a>
                        <a href="https://www.iconfitness.co.il/" target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 bg-blue-50 p-4 rounded-2xl border border-blue-100 text-blue-700 active:scale-[0.98]">
                            <div className="bg-blue-100 p-2 rounded-xl"><Icon name="Globe" size={20} /></div>
                            <div><div className="font-black text-sm">אתר המכון</div><div className="text-[11px] font-bold opacity-70">iconfitness.co.il</div></div>
                        </a>
                    </div>}
                </section>
            </div>
        </div>
    );
};


// ─── FloatingRestTimer ─────────────────────────────────────
const FloatingRestTimer = memo(({ restTimers, restTimerTotals }) => {
    const active = useMemo(() => {
        let best = null;
        for (const id in restTimers) {
            const rt = restTimers[id] || 0;
            const tot = restTimerTotals[id] || 0;
            if (rt > 0 && tot > 0 && (!best || rt < best.rt)) best = { id, rt, tot };
        }
        return best;
    }, [restTimers, restTimerTotals]);
    if (!active) return null;
    const pct = (active.rt / active.tot) * 100; // מלא ויתרוקן
    return (
        <div className="fixed left-0 right-0 z-[700] pointer-events-none"
             style={{top:'env(safe-area-inset-top)'}}>
            <div className="h-3 bg-slate-200/50 overflow-hidden">
                <div className="h-full bg-orange-500 transition-all duration-1000 ease-linear" style={{width: pct + '%'}} />
            </div>
        </div>
    );
});
