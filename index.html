                                                className={`text-[11px] font-bold px-3 py-1.5 rounded-full active:scale-95 transition-all
                                                    ${isSkipped?'bg-orange-200 text-orange-600':'text-slate-500'}`}
                                                style={isSkipped?{}:{background:'linear-gradient(145deg, #dde1e7, #c0c5cc)', boxShadow:'2px 2px 4px rgba(0,0,0,0.1), -1px -1px 3px rgba(255,255,255,0.5)'}}>
                                                {isSkipped ? '↩ בטל' : 'דלג'}
                                            </button>
                                        )}
                                        {isDoneReal
                                            ? <div className="w-9 h-9 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600" style={{boxShadow:'inset 1px 1px 3px rgba(0,0,0,0.1)'}}><Icon name="CheckCircle2" size={20} /></div>
                                            : isSkipped
                                            ? <div className="w-9 h-9 bg-orange-100 rounded-full flex items-center justify-center text-orange-400 font-black text-lg">–</div>
                                            : null}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                })}
                {summaryData && (
                    <div onClick={()=>openSummary(summaryData)}
                        className={`flex items-center gap-3 rounded-[1.6rem] p-4 active:scale-[0.98] cursor-pointer
                            ${allGroupsDone ? 'text-white' : 'text-slate-700'}`}
                        style={allGroupsDone ? {background:'linear-gradient(135deg, #3b82f6, #1d4ed8)', boxShadow:'0 8px 24px rgba(37,99,235,0.3)'} : {background:'linear-gradient(145deg, #d4d8de, #c0c5cc)', boxShadow:'4px 4px 8px rgba(0,0,0,0.1), -2px -2px 6px rgba(255,255,255,0.7)'}}>
                        <div className="text-3xl shrink-0">{allGroupsDone ? '🏆' : '⏳'}</div>
                        <div className="flex-1 min-w-0">
                            <div className="font-black text-sm leading-tight">סיכום האימון האחרון</div>
                            <div className={`text-[11px] font-bold mt-0.5 ${allGroupsDone ? 'text-white/80' : 'text-slate-500'}`}>
                                {fmtDur(summaryData.durationSec)} · {summaryData.doneCount}/{summaryData.totalGroups} תרגילים · {summaryData.totalSets} סטים
                                {summaryData.skipCount>0 ? ` · ${summaryData.skipCount} דולגו` : ''}
                            </div>
                        </div>
                        <span className={`text-[11px] font-black px-3 py-1.5 rounded-full shrink-0 ${allGroupsDone ? 'bg-white/20' : 'bg-slate-200 text-slate-500'}`}>עדכן</span>
                    </div>
                )}
            </main>

            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto backdrop-blur-md border-t px-8 pt-4 flex justify-around items-center z-50 rounded-t-3xl" style={{paddingBottom:'calc(1rem + env(safe-area-inset-bottom))', background:'#ffffff', borderTopColor:'rgba(45,74,111,0.18)', boxShadow:'0 -4px 16px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.4)'}}>
                <button onClick={()=>{setManageOpenSection('exercises');navigateTo('manage');}} className="flex flex-col items-center gap-1 active:opacity-70" style={{color:'#2d4a6f'}}>
                    <Icon name="Dumbbell" size={24} /><span className="text-[11px] font-black">תרגילים</span>
                </button>
                <button onClick={()=>{
                    // תמיד שומר את משך הזמן שנמדד (אם היה) לפני פתיחת אימון חדש — בלי דיאלוג ובלי סיכון לאבד נתונים.
                    // הסטים עצמם (logs) לעולם לא נמחקים כאן; רק מצביע "תחילת אימון נוכחי" מתאפס.
                    if (workoutSec > 0) setSessionDurations(prev=>({...prev,[workoutStartTime]:workoutSec}));
                    startNewWorkout();
                }}
                    className="flex flex-col items-center gap-1 -mt-14 p-3 rounded-full active:scale-90" style={{background:'linear-gradient(145deg, #dde1e7, #c0c5cc)', boxShadow:'4px 4px 10px rgba(0,0,0,0.15), -3px -3px 8px rgba(255,255,255,0.6), inset 0 1px 0 rgba(255,255,255,0.3)'}}>
                    <div className="w-14 h-14 rounded-full flex items-center justify-center text-white" style={{background:'linear-gradient(145deg, #3b5998, #2d4a6f)', boxShadow:'0 4px 12px rgba(45,74,111,0.4), inset 0 1px 0 rgba(255,255,255,0.15)'}}><Icon name="Plus" size={36} /></div>
                    <span className="text-[11px] font-black mt-1 text-slate-600">אימון חדש</span>
                </button>
                <button onClick={()=>navigateTo('manage')} className="flex flex-col items-center gap-1 active:opacity-70" style={{color:'#2d4a6f'}}>
                    <Icon name="Settings" size={24} /><span className="text-[11px] font-black">ניהול</span>
                </button>
            </nav>
        </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function(){
  var src = document.getElementById('app-source').textContent;
  var out = Babel.transform(src, { presets: ['env', ['react', { runtime: 'classic' }]] });
  var s = document.createElement('script');
  s.textContent = out.code;
  document.body.appendChild(s);
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    let _reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_reloaded) return; _reloaded = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
      // בדיקה כל 30 שניות לעדכון
      setInterval(() => reg.update().catch(()=>{}), 30000);
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            // יש גרסה חדשה ממתינה — להפעיל ולרענן
            sw.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(() => {});
  }
</script>
</body>
</html>
